<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyCanvas Pro - GitHub Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; transition: background-color 0.3s; user-select: none; }
        .dark { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-white { background-color: #1e293b; color: #f8fafc; }
        .dark .bg-slate-50 { background-color: #0f172a; }

        /* 正誤アニメーション */
        @keyframes popFade {
            0% { transform: translate(-50%, -40%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
        }
        .feedback-pop {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 150px; z-index: 1000; pointer-events: none;
            animation: popFade 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
        }

        /* スライドイン演出 */
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* カスタムシャドウ */
        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

    <div id="app" class="flex flex-col min-h-screen">
        <header class="h-16 border-b bg-white/80 backdrop-blur sticky top-0 z-50 flex items-center justify-between px-6 dark:bg-slate-900/80 dark:border-slate-800">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="font-black text-xl italic tracking-tighter">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center transition-transform active:scale-90">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-28 max-w-md mx-auto w-full"></main>

        <div id="feedback-layer"></div>

        <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white/90 backdrop-blur border-t flex items-center justify-around z-40 dark:bg-slate-900/90 dark:border-slate-800">
            <button onclick="showHome()" class="flex flex-col items-center gap-1 text-blue-600 transition-colors">
                <i class="fa-solid fa-house-chimney text-xl"></i>
                <span class="text-[10px] font-black uppercase">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-slate-400 opacity-50">
                <i class="fa-solid fa-medal text-xl"></i>
                <span class="text-[10px] font-black uppercase">Badge</span>
            </button>
        </nav>
    </div>

    <script>
        // 設定
        const subjects = [
            { id: 'kokugo', name: '国語', icon: 'fa-book-open', color: 'bg-red-500' },
            { id: 'math', name: '数学', icon: 'fa-calculator', color: 'bg-blue-500' },
            { id: 'science', name: '理科', icon: 'fa-flask', color: 'bg-emerald-500' },
            { id: 'social', name: '社会', icon: 'fa-earth-asia', color: 'bg-amber-500' },
            { id: 'english', name: '英語', icon: 'fa-language', color: 'bg-purple-500' }
        ];

        // 状態管理
        let state = {
            subj: '',
            grade: '',
            queue: [],
            index: 0,
            mistakes: [],
            isDark: false
        };

        function showHome() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-black mb-1 mt-4">こんにちは！</h2>
                    <p class="text-slate-400 text-sm mb-8 font-bold tracking-tight">学びたい教科を選んでください。</p>
                    <div class="grid gap-4">
                        ${subjects.map(s => `
                            <div onclick="showGrade('${s.id}')" class="p-5 bg-white rounded-[28px] border border-slate-100 soft-shadow flex items-center gap-5 active:scale-[0.97] transition-all dark:bg-slate-800 dark:border-slate-700">
                                <div class="${s.color} w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-${s.color}/20">
                                    <i class="fa-solid ${s.icon}"></i>
                                </div>
                                <div>
                                    <h3 class="font-black text-lg">${s.name}</h3>
                                    <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Select Subject</p>
                                </div>
                                <i class="fa-solid fa-chevron-right ml-auto text-slate-300"></i>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showGrade(subjId) {
            state.subj = subjId;
            const subj = subjects.find(s => s.id === subjId);
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showHome()" class="mb-6 text-slate-400 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-8">${subj.name} <span class="text-slate-300">/</span> 学年</h2>
                    <div class="grid gap-4">
                        ${[1, 2, 3].map(g => `
                            <button onclick="state.grade=${g}; showLevel()" class="w-full p-6 bg-white border border-slate-100 rounded-3xl font-black text-xl soft-shadow active:bg-slate-50 transition-all flex justify-between items-center dark:bg-slate-800 dark:border-slate-700">
                                第 ${g} 学年
                                <i class="fa-solid fa-circle-arrow-right text-blue-600"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showLevel() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in text-center">
                    <h2 class="text-2xl font-black mb-10 mt-6">レベルを選択</h2>
                    <div class="grid gap-5">
                        <button onclick="fetchQuestions('basic')" class="p-8 rounded-[40px] bg-blue-600 text-white shadow-xl shadow-blue-500/20 active:scale-95 transition-all">
                            <i class="fa-solid fa-star text-3xl mb-3"></i>
                            <div class="font-black text-xl uppercase tracking-tighter">基本（選択式）</div>
                        </button>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="fetchQuestions('input')" class="p-8 rounded-[40px] bg-white border border-slate-100 text-slate-800 font-black soft-shadow active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                                <i class="fa-solid fa-keyboard text-2xl mb-2 text-emerald-500"></i>
                                <div>確かめ</div>
                            </button>
                            <button onclick="fetchQuestions('essay')" class="p-8 rounded-[40px] bg-white border border-slate-100 text-slate-800 font-black soft-shadow active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                                <i class="fa-solid fa-pen-nib text-2xl mb-2 text-amber-500"></i>
                                <div>応用</div>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchQuestions(type) {
            const fileName = `${state.subj}${state.grade}${type}.json`;
            try {
                const response = await fetch(`./questions/${fileName}`);
                if (!response.ok) throw new Error();
                state.queue = await response.json();
                state.index = 0;
                state.mistakes = [];
                if (state.queue.length === 0) { alert("問題がありません。"); return; }
                render();
            } catch (e) {
                alert(`ファイル読み込みエラー: ${fileName} を確認してください。`);
            }
        }

        function render() {
            if (state.index >= state.queue.length) { finish(); return; }
            const q = state.queue[state.index];
            const container = document.getElementById('view-container');
            
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <span class="px-3 py-1 bg-slate-200 dark:bg-slate-800 rounded-full text-[10px] font-black tracking-widest uppercase">${q.unit}</span>
                        <div class="flex gap-4">
                            <button onclick="showHome()" class="text-xs font-bold text-slate-400">中断</button>
                            <button onclick="finish(true)" class="text-xs font-bold text-red-400">ギブアップ</button>
                        </div>
                    </div>
                    <div class="relative p-10 bg-white rounded-[40px] soft-shadow mb-8 text-center border border-slate-50 dark:bg-slate-800 dark:border-slate-700">
                        <div class="absolute -top-3 left-1/2 -translate-x-1/2 px-4 py-1 bg-slate-900 text-white text-[10px] font-black rounded-full dark:bg-blue-600">Q ${state.index + 1}</div>
                        <p class="text-xl font-black leading-relaxed">${q.question}</p>
                    </div>
                    <div id="answer-zone" class="space-y-3">
                        ${renderInputUI(q)}
                    </div>
                    <button onclick="alert('💡 ヒント: ${q.hint}')" class="w-full mt-10 text-[10px] font-black text-slate-400 uppercase tracking-widest active:text-blue-500 transition-colors">Show Hint</button>
                </div>
            `;
        }

        function renderInputUI(q) {
            if (q.type === 'basic') {
                return q.options.map(o => `<button onclick="check('${o}')" class="w-full p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold text-left hover:border-blue-500 active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700">${o}</button>`).join('');
            } else if (q.type === 'input') {
                return `<input type="text" id="userInput" class="w-full p-5 border-2 border-slate-100 rounded-2xl mb-4 text-center font-bold text-2xl outline-none focus:border-blue-500 dark:bg-white dark:text-slate-900" placeholder="答えを入力">
                        <button onclick="check(document.getElementById('userInput').value)" class="w-full p-5 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-500/20 active:scale-95 transition-all">回答する</button>`;
            } else {
                return `<textarea id="userText" class="w-full p-5 border-2 border-slate-100 rounded-2xl mb-4 h-40 font-medium outline-none focus:border-amber-500 dark:bg-white dark:text-slate-900" placeholder="考えを記述..."></textarea>
                        <button onclick="showEssayAnswer()" class="w-full p-5 bg-amber-500 text-white rounded-2xl font-black active:scale-95 transition-all">正解を確認</button>`;
            }
        }

        function showEssayAnswer() {
            const q = state.queue[state.index];
            document.getElementById('answer-zone').innerHTML = `
                <div class="p-6 bg-slate-100 rounded-3xl mb-5 text-sm font-bold leading-relaxed dark:bg-slate-800">
                    <p class="text-amber-500 mb-2 font-black uppercase text-xs tracking-widest">Model Answer</p>
                    ${q.answer}
                </div>
                <div class="flex gap-4">
                    <button onclick="check('wrong')" class="flex-1 p-5 bg-slate-200 rounded-2xl font-black dark:text-slate-800">× 違う</button>
                    <button onclick="check('correct')" class="flex-1 p-5 bg-emerald-500 text-white rounded-2xl font-black">○ 正解</button>
                </div>
            `;
        }

        function check(ans) {
            const q = state.queue[state.index];
            const isCorrect = (q.type === 'essay') ? (ans === 'correct') : (ans.trim() === q.answer);
            
            // 丸バツアニメーション
            const pop = document.createElement('div');
            pop.className = 'feedback-pop';
            pop.innerHTML = isCorrect ? '<span class="text-red-500">○</span>' : '<span class="text-blue-500">×</span>';
            document.getElementById('feedback-layer').appendChild(pop);
            setTimeout(() => pop.remove(), 800);

            // 解説パネルの表示
            setTimeout(() => showExplanation(isCorrect, q), 500);
        }

        function showExplanation(isCorrect, q) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/60 z-[60] flex items-end';
            overlay.innerHTML = `
                <div class="w-full bg-white rounded-t-[40px] p-8 slide-up dark:bg-slate-900">
                    <div class="max-w-md mx-auto">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-3xl font-black ${isCorrect ? 'text-red-500' : 'text-blue-500'}">${isCorrect ? '正解！' : '不正解'}</h3>
                            <button id="nextBtn" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg active:scale-90 transition-all">次へ</button>
                        </div>
                        <div class="space-y-4 overflow-y-auto max-h-[60vh] pb-10">
                            <div class="p-5 bg-slate-50 rounded-2xl dark:bg-slate-800">
                                <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Reason / 解説</p>
                                <p class="font-bold leading-relaxed text-sm">${q.explanation}</p>
                            </div>
                            ${q.options_explanation ? `
                                <div class="p-5 border-2 border-slate-50 rounded-2xl dark:border-slate-800 dark:border-slate-700">
                                    <p class="text-[10px] font-black text-slate-400 mb-2 uppercase">その他の選択肢</p>
                                    <div class="text-[11px] space-y-2 text-slate-500 leading-relaxed dark:text-slate-400">${q.options_explanation}</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            document.getElementById('nextBtn').onclick = () => {
                overlay.remove();
                if (!isCorrect) {
                    state.queue.push(q);
                    if (!state.mistakes.find(m => m.question === q.question)) state.mistakes.push(q);
                }
                state.index++;
                render();
            };
        }

        function finish(gaveUp = false) {
            const pickup = state.mistakes.length > 0 ? state.mistakes[Math.floor(Math.random() * state.mistakes.length)] : null;
            document.getElementById('view-container').innerHTML = `
                <div class="text-center py-10 fade-in">
                    <h2 class="text-4xl font-black mb-2">${gaveUp ? '中断' : 'CLEAR!'}</h2>
                    <p class="text-slate-400 font-bold mb-10">間違えた問題: ${state.mistakes.length} 問</p>
                    ${pickup ? `
                        <div class="text-left bg-white p-8 rounded-[40px] border-2 border-blue-500 shadow-xl dark:bg-slate-800 dark:border-slate-700">
                            <p class="text-blue-600 font-black text-xs mb-2 uppercase tracking-widest">今日の復習</p>
                            <p class="font-bold mb-4 text-sm">${pickup.question}</p>
                            <div class="text-xs font-bold bg-slate-50 p-5 rounded-2xl leading-relaxed dark:bg-slate-700">
                                <p class="text-red-500 mb-2 underline decoration-2 offset-2">正解: ${pickup.answer}</p>
                                ${pickup.explanation}
                            </div>
                        </div>
                    ` : '<div class="text-red-500 font-black text-2xl py-10 underline decoration-4">PERFECT SCORE!</div>'}
                    <button onclick="showHome()" class="w-full mt-12 p-6 bg-slate-900 text-white rounded-[28px] font-black shadow-xl active:scale-95 transition-all dark:bg-blue-600">ホームに戻る</button>
                </div>
            `;
        }

        document.getElementById('themeToggle').onclick = () => {
            state.isDark = !state.isDark;
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeToggle').innerHTML = state.isDark ? '<i class="fa-solid fa-sun text-yellow-400"></i>' : '<i class="fa-solid fa-moon"></i>';
        };

        showHome();
    </script>
</body>
</html>
