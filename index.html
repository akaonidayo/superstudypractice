<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StudyCanvas Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        :root {
            --header-h: 64px;
            --nav-h: calc(80px + env(safe-area-inset-bottom));
        }
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            user-select: none; 
            margin: 0; 
            background-color: #f1f5f9;
            overflow-x: hidden;
            transition: background-color 0.3s;
        }
        .app-bg { 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex; 
            flex-direction: column; 
        }
        
        /* 基本背景 */
        .app-bg { background-color: #f1f5f9; color: #0f172a; }
        .card-ui { background: white; border: 1px solid #e2e8f0; }

        /* ダークモード設定（上下バーも黒く） */
        .dark .app-bg { background-color: #020617; color: #f8fafc; }
        .dark .card-ui { background: #1e293b; border: 1px solid #334155; }
        .dark input, .dark textarea { background: #0f172a; color: white; border-color: #334155; }
        .dark header, .dark nav { background-color: rgba(2, 6, 23, 0.8) !important; border-color: #1e293b; }

        /* モーダル */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            opacity: 0; 
            pointer-events: none; 
            transition: 0.3s; 
            padding: 20px; 
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); width: 100%; max-width: 340px; }
        .modal-overlay.active .modal-content { transform: scale(1); }

        /* バッジグリッドと100個目の中央配置 */
        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; row-gap: 32px; }
        .badge-btn { display: flex; flex-direction: column; align-items: center; width: 100%; transition: 0.2s; }
        /* 100個目(最後の要素)が3の倍数でない場合に中央に寄せる */
        .badge-btn:last-child:nth-child(3n+1) { grid-column-start: 2; }
        
        .badge-text { 
            font-size: 10px; font-weight: 900; line-height: 1.2; height: 2.4em; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-align: center; margin-top: 8px; width: 100%;
        }

        /* アニメーション */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0, 0.55, 0.45, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* ナビゲーションのボタン色 */
        .nav-btn { color: #94a3b8; transition: color 0.3s; }
        .nav-btn.active { color: #2563eb; }
        .dark .nav-btn.active { color: #60a5fa; }

        nav { padding-bottom: env(safe-area-inset-bottom); height: var(--nav-h); }
    </style>
</head>
<body>
    <div id="app" class="app-bg">
        <header class="h-16 border-b backdrop-blur sticky top-0 z-[200] flex items-center justify-between px-6 bg-white/80 transition-colors">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showHome()">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-pen-nib"></i></div>
                <h1 class="font-black text-xl italic tracking-tighter" id="header-display-name">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center transition-all">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-40 max-w-md mx-auto w-full"></main>
        
        <div id="feedback-layer"></div>
        
        <nav class="fixed bottom-0 left-0 right-0 backdrop-blur border-t flex items-center justify-around z-[200] bg-white/80 transition-colors">
            <button id="nav-home" onclick="showHome()" class="nav-btn flex flex-col items-center font-black px-4 py-2">
                <i class="fa-solid fa-house-chimney text-xl"></i>
                <span class="text-[10px] mt-1">ホーム</span>
            </button>
            <button id="nav-badges" onclick="showBadges()" class="nav-btn flex flex-col items-center font-black px-4 py-2">
                <i class="fa-solid fa-award text-xl"></i>
                <span class="text-[10px] mt-1">バッジ</span>
            </button>
            <button id="nav-profile" onclick="showProfile()" class="nav-btn flex flex-col items-center font-black px-4 py-2">
                <i class="fa-solid fa-user-gear text-xl"></i>
                <span class="text-[10px] mt-1">プロフ</span>
            </button>
        </nav>
    </div>

    <div id="modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content card-ui p-8 text-center shadow-2xl rounded-[2.5rem]" onclick="event.stopPropagation()">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h3 id="modal-title" class="text-2xl font-black mb-1 dark:text-white"></h3>
            <p id="modal-status" class="text-[10px] font-black tracking-widest mb-6"></p>
            <p id="modal-desc" class="text-slate-500 dark:text-slate-200 font-bold mb-8 leading-relaxed whitespace-pre-wrap text-sm"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-blue-600 text-white rounded-full font-black shadow-lg active:scale-95 transition-transform">OK</button>
        </div>
    </div>

    <script>
        // データ定義
        const badgeNames = ["最初の一歩", "学びの芽生え", "ノートの旅人", "ペン先の魔術師", "放課後の覇者", "知識の狩人", "朝活の達人", "記憶の保管者", "図書室の主", "インクの騎士", "閃きの開拓者", "論理の守護者", "集中力の権化", "努力の結晶", "学問の徒", "真理の門", "鉛筆の踊り子", "辞書の探検家", "知性の翼", "静寂の読書家", "数学の天才", "公式の使い手", "計算の荒獅子", "論理の要塞", "数の求道者", "英単語の王", "文法の支配者", "翻訳の達人", "語学の聖域", "対話の達人", "理科の観測者", "元素の支配者", "宇宙の目撃者", "実験の鬼", "自然の友", "歴史の証言者", "地図の覇者", "文明の伝承者", "社会の設計士", "時代の語り部"];
        const badges = [];
        for(let i=0; i<100; i++) {
            let icon = "fa-star", color = "text-yellow-500";
            if(i < 10) { icon = "fa-seedling"; color = "text-green-500"; }
            else if(i < 20) { icon = "fa-bolt"; color = "text-amber-500"; }
            else if(i < 30) { icon = "fa-shield-halved"; color = "text-blue-500"; }
            else if(i < 40) { icon = "fa-gem"; color = "text-cyan-500"; }
            badges.push({ n: badgeNames[i] || `称号 #${i+1}`, t: (i + 1) * 10, i: icon, c: color, s: i >= 30 ? 1 : 0 });
        }

        const subjects = [
            { id: 'kokugo', name: '国語', color: 'bg-red-500', icon: 'fa-book-open', desc: '読解力と言語感覚を磨く', units: { 1: ["漢字の成り立ち", "文の組み立て"], 2: ["敬語", "短歌・俳句"], 3: ["和歌の心", "論説文"] } },
            { id: 'math', name: '数学', color: 'bg-blue-500', icon: 'fa-calculator', desc: '論理的思考と計算力を鍛える', units: { 1: ["正負の数", "方程式"], 2: ["連立方程式", "一次関数"], 3: ["因数分解", "二次方程式"] } },
            { id: 'english', name: '英語', color: 'bg-purple-500', icon: 'fa-language', desc: '世界とつながる言葉を学ぶ', units: { 1: ["be動詞", "一般動詞"], 2: ["未来形", "不定詞"], 3: ["現在完了", "関係代名詞"] } },
            { id: 'science', name: '理科', color: 'bg-emerald-500', icon: 'fa-flask', desc: '自然の仕組みを解き明かす', units: { 1: ["植物", "物質"], 2: ["化学変化", "細胞"], 3: ["イオン", "天体"] } },
            { id: 'social', name: '社会', color: 'bg-amber-500', icon: 'fa-earth-asia', desc: '歴史と社会の繋がりを知る', units: { 1: ["世界の姿", "古代日本"], 2: ["日本の地域", "中世"], 3: ["現代社会", "民主政治"] } }
        ];

        let state = { subj: '', grade: 1, unit: '', type: '', queue: [], index: 0, totalQuestions: 0 };
        const STORAGE_KEY = "canv_master_v1_local";

        function getStats() { 
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { name: "ゲスト", total: 0 }; 
        }

        function saveStats(s) { 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
            if(document.getElementById('header-display-name')) document.getElementById('header-display-name').innerText = s.name;
        }

        // ナビのアクティブ表示切り替え
        function updateActiveNav(id) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${id}`).classList.add('active');
        }

        function showHome() {
            updateActiveNav('home');
            const s = getStats();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <div class="flex items-baseline gap-2 mt-6 mb-8">
                        <span class="text-3xl font-black dark:text-white">${s.name}</span>
                        <span class="text-slate-400 font-bold text-sm">さん</span>
                    </div>
                    <h2 class="text-xl font-black mb-4 dark:text-slate-400">学習を始める</h2>
                    <div class="grid gap-4">
                        ${subjects.map(sj => `
                            <button onclick="showGrade('${sj.id}')" class="card-ui p-5 flex items-center gap-4 rounded-[2rem] shadow-sm active:scale-95 transition-all">
                                <div class="${sj.color} w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg"><i class="fa-solid ${sj.icon}"></i></div>
                                <div class="text-left">
                                    <span class="block font-black text-lg dark:text-white">${sj.name}</span>
                                    <span class="text-[10px] font-bold text-slate-400">${sj.desc}</span>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
        }

        function showBadges() { 
            updateActiveNav('badges');
            const s = getStats(); 
            document.getElementById('view-container').innerHTML = `<div class="fade-in">
                <h2 class="text-3xl font-black mt-6 mb-10 px-1 dark:text-white">コレクション</h2>
                <div class="badge-grid">${badges.map((b) => { 
                    const val = s.total || 0; const isUnlocked = val >= b.t; const isHiding = b.s === 1 && !isUnlocked; 
                    const iconClass = isUnlocked ? b.c : 'text-slate-200 dark:text-slate-700';
                    const iconHtml = `<div class="card-ui w-20 h-20 flex items-center justify-center rounded-[2.2rem] border-2 shadow-inner"><i class="fa-solid ${isHiding ? 'fa-lock' : b.i} ${iconClass} text-3xl"></i></div>`;
                    const displayName = isHiding ? '？？？？' : b.n;
                    let desc = isUnlocked ? `獲得済み！\n累計 ${b.t} 問正解を達成しました。` : (!isHiding ? `あと ${b.t - val} 問正解で獲得できます。` : `このバッジの正体は秘密です。`);
                    return `<button onclick="openModal('${displayName}', '${iconHtml.replace(/"/g, '&quot;')}', '${isUnlocked ? '獲得済み' : '未獲得'}', '${desc.replace(/\n/g, '\\n')}')" class="badge-btn active:scale-90">${iconHtml}<span class="badge-text font-black dark:text-slate-400 ${isHiding ? 'text-slate-400' : ''}">${displayName}</span></button>`;
                }).join('')}</div>
            </div>`; 
        }

        function showProfile() {
            updateActiveNav('profile');
            const s = getStats();
            document.getElementById('view-container').innerHTML = `<div class="fade-in">
                <h2 class="text-3xl font-black mt-6 mb-8 dark:text-white">プロフィール</h2>
                <div class="card-ui p-6 rounded-[2.5rem] mb-6">
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-3 block px-1">ニックネーム</label>
                    <div class="flex gap-3">
                        <input type="text" id="nn" value="${s.name}" class="flex-1 p-4 rounded-full font-black outline-none border-2 dark:bg-slate-800 dark:border-slate-700 dark:text-white">
                        <button onclick="saveName()" class="bg-blue-600 text-white px-6 py-4 rounded-full font-black">保存</button>
                    </div>
                </div>
                <div class="card-ui p-8 rounded-[2.5rem] shadow-sm">
                    <h3 class="text-slate-400 text-[10px] font-black uppercase mb-6">累計正解数</h3>
                    <div class="flex justify-between items-end border-b pb-4 dark:border-slate-800">
                        <span class="text-5xl text-blue-600 font-black">${s.total}</span>
                        <span class="font-black text-slate-500">問</span>
                    </div>
                </div>
            </div>`;
        }

        function saveName() {
            const s = getStats(); s.name = document.getElementById('nn').value.trim() || "ゲスト";
            saveStats(s); openModal("保存完了", "<i class='fa-solid fa-check-circle text-emerald-500'></i>", "SUCCESS", "名前を更新しました");
        }

        function openModal(title, iconHtml, status, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-icon').innerHTML = iconHtml;
            document.getElementById('modal-status').innerText = status;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function showGrade(subjId) {
            state.subj = subjId;
            document.getElementById('view-container').innerHTML = `<div class="fade-in">
                <button onclick="showHome()" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                <h2 class="text-2xl font-black mb-6 dark:text-white">学年を選択</h2>
                <div class="grid gap-3">${[1, 2, 3].map(g => `<button onclick="showUnit('${subjId}', ${g})" class="card-ui p-6 rounded-[1.5rem] font-black text-xl flex justify-between items-center active:bg-blue-50">第${g}学年<i class="fa-solid fa-chevron-right text-blue-500"></i></button>`).join('')}</div>
            </div>`;
        }

        function showUnit(subjId, grade) {
            state.grade = grade;
            const units = subjects.find(s => s.id === subjId).units[grade] || [];
            document.getElementById('view-container').innerHTML = `<div class="fade-in">
                <button onclick="showGrade('${subjId}')" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                <h2 class="text-2xl font-black mb-6 dark:text-white">単元を選択</h2>
                <div class="grid gap-3">${units.map(u => `<button onclick="state.unit='${u}'; alert('ここから先のFetch機能はサーバー上で動かしてください')" class="card-ui p-5 rounded-2xl font-bold text-left border-l-4 border-blue-500">${u}</button>`).join('')}</div>
            </div>`;
        }

        // テーマ維持のロジック
        const themeBtn = document.getElementById('themeToggle');
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeBtn.innerHTML = '<i class="fa-solid fa-sun text-yellow-400"></i>';
            } else {
                document.documentElement.classList.remove('dark');
                themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
            localStorage.setItem('canv_theme', theme);
        }

        themeBtn.onclick = () => {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
        };

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('canv_theme') || 'light';
            applyTheme(savedTheme);
            showHome();
        });
    </script>
</body>
</html>
