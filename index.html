<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyCanvas Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; transition: 0.3s; user-select: none; margin: 0; }
        .app-bg { min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        
        /* 基本スタイル（ライトモード） */
        .app-bg { background-color: #f1f5f9; color: #0f172a; }
        .card-ui { background: white; border: 1px solid #e2e8f0; }

        /* 修正：htmlタグに .dark がついた時の挙動を一貫させる */
        .dark .app-bg { background-color: #020617; color: #f8fafc; }
        .dark .card-ui { background: #1e293b; border: 1px solid #334155; }
        .dark input, .dark textarea { background: #0f172a; color: white; border-color: #334155; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); width: 100%; max-width: 340px; }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .slide-up { animation: slideUp 0.4s cubic-bezier(0, 0.55, 0.45, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .feedback-pop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15rem; font-weight: 900; z-index: 100; pointer-events: none; animation: popScale 0.8s ease-out forwards; }
        @keyframes popScale { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 0; } }

        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; row-gap: 32px; }
        .badge-btn { display: flex; flex-direction: column; align-items: center; width: 100%; transition: 0.2s; }
        .badge-text { 
            font-size: 10px; font-weight: 900; line-height: 1.2; height: 2.4em; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-align: center; margin-top: 8px; width: 100%;
        }
        progress::-webkit-progress-bar { background-color: #e2e8f0; border-radius: 10px; }
        .dark progress::-webkit-progress-bar { background-color: #334155; }
    </style>
</head>
<body>
    <div id="app" class="app-bg">
        <header class="h-16 border-b backdrop-blur sticky top-0 z-50 flex items-center justify-between px-6 dark:border-slate-800">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showHome()">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-pen-nib"></i></div>
                <h1 class="font-black text-xl italic tracking-tighter" id="header-display-name">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center transition-all"><i class="fa-solid fa-moon"></i></button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-32 max-w-md mx-auto w-full"></main>
        <div id="feedback-layer"></div>
        
        <nav class="fixed bottom-0 left-0 right-0 h-20 backdrop-blur border-t flex items-center justify-around z-40 dark:border-slate-800">
            <button onclick="showHome()" class="flex flex-col items-center text-slate-400 font-black active:text-blue-600 transition-colors"><i class="fa-solid fa-house-chimney text-xl"></i><span class="text-[10px] mt-1">HOME</span></button>
            <button onclick="showBadges()" class="flex flex-col items-center text-slate-400 font-black active:text-blue-600 transition-colors"><i class="fa-solid fa-award text-xl"></i><span class="text-[10px] mt-1">BADGES</span></button>
            <button onclick="showProfile()" class="flex flex-col items-center text-slate-400 font-black active:text-blue-600 transition-colors"><i class="fa-solid fa-user-gear text-xl"></i><span class="text-[10px] mt-1">PROFILE</span></button>
        </nav>
    </div>

    <div id="modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content card-ui p-8 text-center shadow-2xl rounded-[2.5rem]" onclick="event.stopPropagation()">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h3 id="modal-title" class="text-2xl font-black mb-1"></h3>
            <p id="modal-status" class="text-[10px] font-black tracking-widest mb-6"></p>
            <p id="modal-desc" class="text-slate-500 dark:text-slate-400 font-bold mb-8 leading-relaxed whitespace-pre-wrap text-sm"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-blue-600 text-white rounded-full font-black shadow-lg active:scale-95 transition-transform">OK</button>
        </div>
    </div>

    <script>
        // --- データ定義 ---
        const badgeNames = ["最初の一歩", "学びの芽生え", "ノートの旅人", "ペン先の魔術師", "放課後の覇者", "知識の狩人", "朝活の達人", "記憶の保管者", "図書室の主", "インクの騎士", "閃きの開拓者", "論理の守護者", "集中力の権化", "努力の結晶", "学問の徒", "真理の門", "鉛筆の踊り子", "辞書の探検家", "知性の翼", "静寂の読書家", "数学の天才", "公式の使い手", "計算の荒獅子", "論理の要塞", "数の求道者", "英単語の王", "文法の支配者", "翻訳の達人", "語学の聖域", "対話の達人", "理科の観測者", "元素の支配者", "宇宙の目撃者", "実験の鬼", "自然の友", "歴史の証言者", "地図の覇者", "文明の伝承者", "社会の設計士", "時代の語り部"];
        const badges = [];
        for(let i=0; i<100; i++) {
            let icon = "fa-star", color = "text-yellow-500";
            if(i < 10) { icon = "fa-seedling"; color = "text-green-500"; }
            else if(i < 20) { icon = "fa-bolt"; color = "text-amber-500"; }
            else if(i < 30) { icon = "fa-shield-halved"; color = "text-blue-500"; }
            else if(i < 40) { icon = "fa-gem"; color = "text-cyan-500"; }
            badges.push({ n: badgeNames[i] || `栄光の称号 #${i+1}`, t: (i + 1) * 10, i: icon, c: color, s: i >= 30 ? 1 : 0 });
        }

        const subjects = [
            { id: 'kokugo', name: '国語', color: 'bg-red-500', icon: 'fa-book-open', desc: '読解力と言語感覚を磨く', units: { 1: ["漢字の成り立ち", "文の組み立て", "指示語と接続語"], 2: ["敬語の使い方", "短歌・俳句", "論理の展開"], 3: ["和歌の心", "論説文の読解"] } },
            { id: 'math', name: '数学', color: 'bg-blue-500', icon: 'fa-calculator', desc: '論理的思考と計算力を鍛える', units: { 1: ["正負の数", "文字式", "方程式"], 2: ["式の計算", "連立方程式", "一次関数"], 3: ["展開・因数分解", "平方根", "二次方程式"] } },
            { id: 'english', name: '英語', color: 'bg-purple-500', icon: 'fa-language', desc: '世界とつながる言葉を学ぶ', units: { 1: ["be動詞", "一般動詞"], 2: ["未来形", "不定詞", "比較"], 3: ["現在完了", "関係代名詞", "仮定法"] } },
            { id: 'science', name: '理科', color: 'bg-emerald-500', icon: 'fa-flask', desc: '自然の仕組みを解き明かす', units: { 1: ["植物の生活", "物質の性質"], 2: ["化学変化", "生物の細胞"], 3: ["イオン", "天体"] } },
            { id: 'social', name: '社会', color: 'bg-amber-500', icon: 'fa-earth-asia', desc: '歴史と社会の繋がりを知る', units: { 1: ["世界の姿", "古代までの日本"], 2: ["日本の地域構成", "中世の日本"], 3: ["現代社会", "民主政治"] } }
        ];

        // --- 状態管理 ---
        let state = {
            subj: '', grade: 1, unit: '', type: '',
            queue: [], index: 0, totalQuestions: 0, mistakes: []
        };

        const COOKIE_KEY = "canv_master_v1";
        function getStats() { 
            const m = document.cookie.match(new RegExp(COOKIE_KEY + '=([^;]+)')); 
            return m ? JSON.parse(m[1]) : { name: "ゲスト", total: 0, math:0, english:0, science:0, social:0, kokugo:0 }; 
        }
        function saveStats(s) { 
            document.cookie = `${COOKIE_KEY}=${JSON.stringify(s)}; max-age=31536000; path=/`; 
            const headerName = document.getElementById('header-display-name');
            if(headerName) headerName.innerText = s.name;
        }

        // --- 画面表示関数 ---
        function showHome() {
            const s = getStats();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <div class="flex items-baseline gap-2 mt-6 mb-8">
                        <span class="text-3xl font-black">${s.name}</span>
                        <span class="text-slate-400 font-bold text-sm">さん</span>
                    </div>
                    <h2 class="text-xl font-black mb-4">学習を始める</h2>
                    <div class="grid gap-4">
                        ${subjects.map(sj => `
                            <button onclick="showGrade('${sj.id}')" class="card-ui p-5 flex items-center gap-4 rounded-[2rem] shadow-sm active:scale-95 transition-all">
                                <div class="${sj.color} w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg">
                                    <i class="fa-solid ${sj.icon}"></i>
                                </div>
                                <div class="text-left">
                                    <span class="block font-black text-lg">${sj.name}</span>
                                    <span class="text-[10px] font-bold text-slate-400">${sj.desc}</span>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
            saveStats(s);
        }

        function showGrade(subjId) {
            state.subj = subjId;
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showHome()" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-6">学年を選択</h2>
                    <div class="grid gap-3">
                        ${[1, 2, 3].map(g => `
                            <button onclick="showUnit('${subjId}', ${g})" class="card-ui p-6 rounded-[1.5rem] font-black text-xl flex justify-between items-center active:bg-blue-50 dark:active:bg-slate-700 transition-colors">
                                中学校 第${g}学年
                                <i class="fa-solid fa-chevron-right text-blue-500"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
        }

        function showUnit(subjId, grade) {
            state.grade = grade;
            const subj = subjects.find(s => s.id === subjId);
            const units = subj.units[grade] || [];
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showGrade('${subjId}')" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-6 italic">単元を選択</h2>
                    <div class="grid gap-3">
                        ${units.map(u => `
                            <button onclick="state.unit='${u}'; showLevel()" class="card-ui p-5 rounded-2xl font-bold text-left border-l-4 border-blue-500 active:bg-blue-50 dark:active:bg-slate-800 transition-colors">
                                ${u}
                            </button>
                        `).join('')}
                    </div>
                </div>`;
        }

        function showLevel() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in text-center">
                    <button onclick="showUnit('${state.subj}', ${state.grade})" class="mb-4 text-slate-500 font-bold flex items-center gap-2 text-left"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-8 mt-4">レベルを選択</h2>
                    <div class="grid gap-5">
                        <button onclick="fetchQuestions('basic')" class="p-8 rounded-[2.5rem] bg-blue-600 text-white shadow-xl font-black text-xl active:scale-95 transition-transform">基本・選択</button>
                        <button onclick="fetchQuestions('input')" class="p-8 rounded-[2.5rem] bg-emerald-500 text-white shadow-xl font-black text-xl active:scale-95 transition-transform">確かめ・入力</button>
                        <button onclick="fetchQuestions('essay')" class="p-8 rounded-[2.5rem] bg-amber-500 text-white shadow-xl font-black text-xl active:scale-95 transition-transform">応用・記述</button>
                    </div>
                </div>`;
        }

        async function fetchQuestions(type) {
            state.type = type;
            const container = document.getElementById('view-container');
            container.innerHTML = `<div class="flex items-center justify-center min-h-[50vh]"><i class="fa-solid fa-circle-notch animate-spin text-4xl text-blue-500"></i></div>`;
            
            try {
                const response = await fetch(`questions/${state.subj}${state.grade}${type}.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                state.queue = data.filter(q => q.unit === state.unit).sort(() => Math.random() - 0.5);
                if (state.queue.length === 0) throw new Error("No data");
                
                state.index = 0;
                state.totalQuestions = state.queue.length;
                state.mistakes = [];
                render();
            } catch (e) {
                container.innerHTML = `<div class="text-center py-20"><i class="fa-solid fa-circle-exclamation text-4xl text-red-400 mb-4"></i><p class="font-black">問題データが見つかりませんでした</p><button onclick="showLevel()" class="mt-8 px-8 py-3 bg-slate-200 dark:bg-slate-800 rounded-full font-black text-sm">戻る</button></div>`;
            }
        }

        function render() {
            if (state.index >= state.queue.length) { finish(); return; }
            const q = state.queue[state.index];
            const progress = (state.index / state.totalQuestions) * 100;
            const container = document.getElementById('view-container');
            
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="px-3 py-1 bg-slate-900 text-white rounded-full text-[10px] font-black uppercase">${q.unit}</span>
                        <div class="text-right">
                            <span class="text-lg font-black text-blue-600">${state.index + 1}</span>
                            <span class="text-xs font-bold text-slate-400"> / ${state.totalQuestions}</span>
                        </div>
                    </div>
                    <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full mb-6 overflow-hidden">
                        <div class="h-full bg-blue-500 transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                    <div class="card-ui relative p-10 rounded-[2.5rem] shadow-sm text-center mb-8 min-h-[160px] flex items-center justify-center">
                        <p class="text-xl font-black leading-relaxed">${q.question}</p>
                    </div>
                    <div id="answer-zone" class="space-y-3">${renderUI(q)}</div>
                </div>`;
        }

        function renderUI(q) {
            if (state.type === 'basic') {
                return q.options.map(o => `
                    <button onclick="check('${o}')" class="card-ui w-full p-5 rounded-2xl font-bold text-left active:scale-95 hover:border-blue-500 transition-all">
                        ${o}
                    </button>`).join('');
            }
            if (state.type === 'input') {
                return `
                    <input type="text" id="userInput" class="w-full p-5 border-2 rounded-2xl mb-4 text-center font-bold text-2xl dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="答えを入力" autofocus>
                    <button onclick="check(document.getElementById('userInput').value)" class="w-full p-5 bg-blue-600 text-white rounded-2xl font-black shadow-lg">回答を送信</button>`;
            }
            return `
                <textarea id="userText" class="w-full p-5 border-2 rounded-2xl mb-4 h-40 font-medium dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="ここに考え方をメモできます..."></textarea>
                <button onclick="check('essay_confirm')" class="w-full p-5 bg-amber-500 text-white rounded-2xl font-black shadow-lg">正解を確認する</button>`;
        }

        function check(ans) {
            const q = state.queue[state.index];
            const isCorrect = (state.type === 'essay') ? true : (ans.trim() === q.answer);
            
            const pop = document.createElement('div'); pop.className = 'feedback-pop';
            pop.innerHTML = isCorrect ? '<span class="text-red-500">○</span>' : '<span class="text-blue-500">×</span>';
            document.getElementById('feedback-layer').appendChild(pop);
            
            setTimeout(() => pop.remove(), 800);
            setTimeout(() => showExplanation(isCorrect, q), 500);
        }

        function showExplanation(isCorrect, q) {
            const overlay = document.createElement('div'); 
            overlay.className = 'fixed inset-0 bg-black/60 z-[60] flex items-end';
            // 修正：解説エリアの背景色と文字色にダークモード対応を追加
            overlay.innerHTML = `
                <div class="w-full bg-white dark:bg-slate-900 rounded-t-[40px] p-8 slide-up border-t-4 ${isCorrect ? 'border-red-500' : 'border-blue-500'}">
                    <div class="max-w-md mx-auto pb-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-3xl font-black ${isCorrect ? 'text-red-500' : 'text-blue-500'}">${isCorrect ? '正解！' : '不正解...'}</h3>
                            <button id="nextBtn" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg">次へ進む</button>
                        </div>
                        <div class="p-5 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">解説</p>
                            <p class="font-bold text-sm leading-relaxed dark:text-slate-200">${q.explanation}</p>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            document.getElementById('nextBtn').onclick = () => { 
                overlay.remove(); 
                if (isCorrect) {
                    const s = getStats();
                    s.total++;
                    s[state.subj] = (s[state.subj] || 0) + 1;
                    saveStats(s);
                } else {
                    state.queue.push(q);
                }
                state.index++; 
                render(); 
            };
        }

        function finish() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in text-center py-10">
                    <div class="w-24 h-24 bg-yellow-400 rounded-full flex items-center justify-center text-white text-5xl mx-auto mb-6 shadow-xl animate-bounce"><i class="fa-solid fa-crown"></i></div>
                    <h2 class="text-3xl font-black mb-2">COMPLETE!</h2>
                    <p class="text-slate-500 font-bold mb-10">全ての課題をクリアしました</p>
                    <button onclick="showHome()" class="w-full py-5 bg-blue-600 text-white rounded-full font-black shadow-lg">ホームに戻る</button>
                </div>`;
        }

        function showProfile() {
            const s = getStats();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-3xl font-black mt-6 mb-8">プロフィール</h2>
                    <div class="card-ui p-6 rounded-[2.5rem] mb-6 shadow-sm">
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-3 block px-1">ニックネーム</label>
                        <div class="flex flex-wrap gap-3">
                            <input type="text" id="nn" value="${s.name}" class="flex-1 min-w-[150px] p-4 rounded-full font-black outline-none border-2 transition-all focus:border-blue-500 dark:bg-slate-800 dark:border-slate-700 dark:text-white">
                            <button onclick="saveName()" class="bg-blue-600 text-white px-8 py-4 rounded-full font-black shadow-lg">保存</button>
                        </div>
                    </div>
                    <div class="card-ui p-8 rounded-[2.5rem] shadow-sm">
                        <h3 class="text-slate-400 text-[10px] font-black uppercase mb-6 tracking-widest italic">学習レポート</h3>
                        <div class="flex justify-between items-end mb-10 border-b pb-4 dark:border-slate-800">
                            <span class="font-black text-slate-500 text-sm">累計正解数</span>
                            <span class="text-5xl text-blue-600 font-black">${s.total}</span>
                        </div>
                        <div class="space-y-6">
                            ${subjects.map(sj => {
                                const count = s[sj.id] || 0;
                                const percent = Math.min(100, (count / 20) * 100);
                                return `<div><div class="flex justify-between items-center mb-2 px-1"><span class="font-black text-sm">${sj.name}</span><span class="text-xs font-bold text-slate-400">${count} 問</span></div><div class=\"w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden\"><div class=\"${sj.color} h-full transition-all duration-1000\" style=\"width: ${percent}%\"></div></div></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function saveName() {
            const s = getStats();
            s.name = document.getElementById('nn').value.trim() || "ゲスト";
            saveStats(s);
            openModal("保存完了", "<i class='fa-solid fa-check-circle text-emerald-500'></i>", "SUCCESS", "ニックネームを更新しました！");
        }

        function openModal(title, iconHtml, status, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-icon').innerHTML = iconHtml;
            document.getElementById('modal-status').innerText = status;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        
        function showBadges() { 
            const s = getStats(); 
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-3xl font-black mt-6 mb-10 px-1">コレクション</h2>
                    <div class="badge-grid">
                        ${badges.map((b) => { 
                            const val = s.total || 0; const isUnlocked = val >= b.t; const isHiding = b.s === 1 && !isUnlocked; 
                            const iconClass = isUnlocked ? b.c : 'text-slate-200 dark:text-slate-700';
                            const borderClass = isUnlocked ? b.c.replace('text','border') : 'border-transparent';
                            const iconHtml = `<div class=\"card-ui w-20 h-20 flex items-center justify-center rounded-[2.2rem] border-2 ${borderClass} shadow-inner\"><i class=\"fa-solid ${isHiding ? 'fa-lock' : b.i} ${iconClass} text-3xl\"></i></div>`;
                            const displayName = isHiding ? '？？？？' : b.n;
                            const statusText = isUnlocked ? '獲得済み' : '未獲得';
                            let desc = isUnlocked ? `獲得済み！\n累計 ${b.t} 問正解を達成しました。` : (!isHiding ? `あと ${b.t - val} 問正解で獲得できます。\n(目標: ${b.t} / 現在: ${val})` : `このバッジの正体は秘密です。`);
                            return `<button onclick="openModal('${displayName}', '${iconHtml.replace(/"/g, '&quot;')}', '${statusText}', '${desc.replace(/\n/g, '\\n')}')" class="badge-btn active:scale-90">${iconHtml}<span class="badge-text font-black ${isHiding ? 'text-slate-400' : ''}">${displayName}</span></button>`;
                        }).join('')}
                    </div>
                </div>`; 
        }

        // --- テーマ切り替えの修正 ---
        document.getElementById('themeToggle').onclick = () => {
            // bodyではなくdocumentElement(htmlタグ)を操作
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeToggle').innerHTML = isDark ? '<i class="fa-solid fa-sun text-yellow-400"></i>' : '<i class="fa-solid fa-moon"></i>';
        };

        showHome();
    </script>
</body>
</html>
