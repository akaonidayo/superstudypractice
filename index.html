<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyCanvas Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; transition: 0.3s; user-select: none; }
        
        /* ライトモードの視認性向上：コントラストを強化 */
        body:not(.dark) { background-color: #f1f5f9; color: #0f172a; }
        body:not(.dark) .bg-white { border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        
        .dark { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-white { background-color: #1e293b; color: #f8fafc; border-color: #334155; }
        
        /* プログレスバーのアニメーション */
        .progress-bar { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes popFade { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1); opacity: 0; } }
        .feedback-pop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; z-index: 1000; pointer-events: none; animation: popFade 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="overflow-x-hidden">

    <div id="app" class="flex flex-col min-h-screen">
        <header class="h-16 border-b bg-white/90 backdrop-blur sticky top-0 z-50 flex items-center justify-between px-6 dark:bg-slate-900/90 dark:border-slate-800">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showHome()">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="font-black text-xl italic tracking-tighter">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center transition-transform active:scale-90">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-28 max-w-md mx-auto w-full"></main>
        <div id="feedback-layer"></div>

        <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white/90 backdrop-blur border-t flex items-center justify-around z-40 dark:bg-slate-900/90 dark:border-slate-800">
            <button onclick="showHome()" class="flex flex-col items-center gap-1 text-blue-600">
                <i class="fa-solid fa-house-chimney text-xl"></i>
                <span class="text-[10px] font-black uppercase">Home</span>
            </button>
            <button onclick="showBadges()" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400">
                <i class="fa-solid fa-award text-xl"></i>
                <span class="text-[10px] font-black uppercase">Badges</span>
            </button>
            <button onclick="showProfile()" class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400">
                <i class="fa-solid fa-user-gear text-xl"></i>
                <span class="text-[10px] font-black uppercase">Profile</span>
            </button>
        </nav>
    </div>

    <script>
        const subjects = [
            { id: 'kokugo', name: '国語', color: 'bg-red-500', icon: 'fa-book-open', desc: '読解力と言語感覚を磨く', units: { 1: ["漢字", "文法", "古文"], 2: ["短歌", "随筆"], 3: ["論説", "和歌"] } },
            { id: 'math', name: '数学', color: 'bg-blue-500', icon: 'fa-calculator', desc: '論理的思考と計算力を鍛える', units: { 1: ["正負の数", "文字式", "方程式"], 2: ["式の計算", "連立方程式", "一次関数"], 3: ["展開・因数分解", "平方根", "二次方程式"] } },
            { id: 'science', name: '理科', color: 'bg-emerald-500', icon: 'fa-flask', desc: '自然の仕組みと科学を学ぶ', units: { 1: ["植物", "光・音"], 2: ["化学変化", "電気"], 3: ["運動", "天体"] } },
            { id: 'social', name: '社会', color: 'bg-amber-500', icon: 'fa-earth-asia', desc: '歴史・地理・社会の構造を知る', units: { 1: ["地理", "歴史初期"], 2: ["歴史中期", "近現代"], 3: ["公民"] } },
            { id: 'english', name: '英語', color: 'bg-purple-500', icon: 'fa-language', desc: '世界とつながる言葉を習得', units: { 1: ["Be動詞", "一般動詞"], 2: ["不定詞", "比較"], 3: ["現在完了", "関係代名詞"] } }
        ];

        let state = { subj: '', grade: '', unit: '', queue: [], index: 0, totalQuestions: 0, mistakes: [], isDark: false };

        // --- COOKIE 管理 ---
        function setStats(correctCount) {
            let stats = getStats();
            stats.totalCorrect += correctCount;
            stats.totalSessions += 1;
            document.cookie = `study_stats=${JSON.stringify(stats)}; max-age=31536000; path=/`;
        }

        function getStats() {
            const match = document.cookie.match(/study_stats=([^;]+)/);
            return match ? JSON.parse(match[1]) : { totalCorrect: 0, totalSessions: 0 };
        }

        // --- 画面表示 ---
        function showHome() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-black mb-1 mt-4">学習を始める</h2>
                    <p class="text-slate-500 dark:text-slate-400 text-xs font-bold mb-6">目標の教科を選択してください</p>
                    <div class="grid gap-4">
                        ${subjects.map(s => `
                            <button onclick="showGrade('${s.id}')" class="group p-5 bg-white rounded-[2rem] flex items-center gap-4 active:scale-95 transition-all dark:bg-slate-800">
                                <div class="${s.color} w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-${s.color}/30">
                                    <i class="fa-solid ${s.icon}"></i>
                                </div>
                                <div class="text-left">
                                    <span class="block font-black text-lg leading-none mb-1">${s.name}</span>
                                    <span class="text-[10px] font-bold text-slate-400 group-hover:text-slate-600 transition-colors">${s.desc}</span>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showGrade(subjId) {
            state.subj = subjId;
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showHome()" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-2">学年を選択</h2>
                    <p class="text-slate-500 text-xs font-bold mb-6">自分のレベルに合わせた学年を選びます</p>
                    <div class="grid gap-3">
                        ${[1, 2, 3].map(g => `
                            <button onclick="showUnit('${subjId}', ${g})" class="p-6 bg-white rounded-[1.5rem] font-black text-xl flex justify-between items-center active:bg-blue-50 dark:active:bg-slate-700 transition-colors">
                                中学校 第${g}学年
                                <i class="fa-solid fa-chevron-right text-blue-500"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showUnit(subjId, grade) {
            state.grade = grade;
            const subj = subjects.find(s => s.id === subjId);
            const units = subj.units[grade] || [];
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showGrade('${subjId}')" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-2 italic">単元を選択</h2>
                    <p class="text-slate-500 text-xs font-bold mb-6">集中して学習したい単元を選んでください</p>
                    <div class="grid gap-3">
                        ${units.map(u => `
                            <button onclick="state.unit='${u}'; showLevel()" class="p-5 bg-white rounded-2xl font-bold text-left border-l-4 border-blue-500 hover:bg-blue-50 dark:hover:bg-slate-700 transition-colors">
                                ${u}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showLevel() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in text-center">
                    <h2 class="text-2xl font-black mb-2 mt-6">レベルを選択</h2>
                    <p class="text-slate-500 text-xs font-bold mb-10">問題の出題形式が変わります</p>
                    <div class="grid gap-5">
                        <button onclick="fetchQuestions('basic')" class="p-8 rounded-[2.5rem] bg-blue-600 text-white shadow-xl shadow-blue-500/20 font-black text-xl">
                            基本・選択
                            <span class="block text-[10px] opacity-70">4択の中から正解を選びます</span>
                        </button>
                        <button onclick="fetchQuestions('input')" class="p-8 rounded-[2.5rem] bg-emerald-500 text-white shadow-xl shadow-emerald-500/20 font-black text-xl">
                            確かめ・入力
                            <span class="block text-[10px] opacity-70">答えを直接キーボードで入力します</span>
                        </button>
                        <button onclick="fetchQuestions('essay')" class="p-8 rounded-[2.5rem] bg-amber-500 text-white shadow-xl shadow-amber-500/20 font-black text-xl">
                            応用・記述
                            <span class="block text-[10px] opacity-70">考え方を書き、解答と照らし合わせます</span>
                        </button>
                    </div>
                </div>
            `;
        }

        async function fetchQuestions(type) {
            const fileName = `${state.subj}${state.grade}${type}.json`;
            try {
                const response = await fetch(`./questions/${fileName}`);
                if (!response.ok) throw new Error();
                const all = await response.json();
                state.queue = all.filter(q => q.unit === state.unit);
                state.index = 0;
                state.totalQuestions = state.queue.length;
                state.mistakes = [];
                if (state.queue.length === 0) { alert(`${state.unit}の問題がまだありません。`); return; }
                render();
            } catch (e) { alert("問題が見つかりません。JSONファイルが正しいか確認してください。"); }
        }

        function render() {
            if (state.index >= state.queue.length) { finish(); return; }
            const q = state.queue[state.index];
            const progress = ((state.index) / state.totalQuestions) * 100;
            const container = document.getElementById('view-container');
            
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="px-3 py-1 bg-slate-900 text-white rounded-full text-[10px] font-black">${q.unit}</span>
                        <div class="text-right">
                            <span class="text-lg font-black text-blue-600">${state.index + 1}</span>
                            <span class="text-xs font-bold text-slate-400"> / ${state.totalQuestions}</span>
                        </div>
                    </div>
                    
                    <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full mb-6 overflow-hidden">
                        <div class="progress-bar h-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]" style="width: ${progress}%"></div>
                    </div>

                    <div class="relative p-10 bg-white rounded-[2.5rem] shadow-sm border dark:bg-slate-800 dark:border-slate-700 text-center mb-8 min-h-[160px] flex items-center justify-center">
                        <p class="text-xl font-black leading-relaxed">${q.question}</p>
                    </div>

                    <div id="answer-zone" class="space-y-3">${renderUI(q)}</div>

                    <div class="mt-10 flex justify-center">
                        <button onclick="confirmExit()" class="text-xs font-black text-slate-400 hover:text-red-500 flex items-center gap-2 transition-colors italic">
                            <i class="fa-solid fa-circle-stop text-sm"></i> 学習を一時中断する
                        </button>
                    </div>
                </div>
            `;
        }

        function confirmExit() {
            if(confirm("ここまでの学習を保存して中断しますか？")) {
                showHome();
            }
        }

        function renderUI(q) {
            if (q.type === 'basic') return q.options.map(o => `<button onclick="check('${o}')" class="w-full p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold text-left active:scale-95 hover:border-blue-500 transition-all dark:bg-slate-800 dark:border-slate-700">${o}</button>`).join('');
            if (q.type === 'input') return `<input type="text" id="userInput" class="w-full p-5 border-2 rounded-2xl mb-4 text-center font-bold text-2xl dark:bg-slate-700 dark:text-white" placeholder="答えを入力" autofocus><button onclick="check(document.getElementById('userInput').value)" class="w-full p-5 bg-blue-600 text-white rounded-2xl font-black shadow-lg">回答を送信</button>`;
            return `<textarea id="userText" class="w-full p-5 border-2 rounded-2xl mb-4 h-40 font-medium dark:bg-slate-700 dark:text-white" placeholder="ここに考え方をメモできます..."></textarea><button onclick="showEssayAnswer()" class="w-full p-5 bg-amber-500 text-white rounded-2xl font-black shadow-lg">正解を確認する</button>`;
        }

        function showEssayAnswer() {
            const q = state.queue[state.index];
            document.getElementById('answer-zone').innerHTML = `
                <div class="p-6 bg-blue-50 dark:bg-slate-700 rounded-3xl mb-5 text-sm font-bold border-2 border-blue-100 dark:border-slate-600">
                    <span class="text-blue-600 dark:text-blue-400 text-xs block mb-2 font-black">【模範解答】</span>
                    ${q.answer}
                </div>
                <div class="flex gap-4">
                    <button onclick="check('wrong')" class="flex-1 p-5 bg-slate-200 text-slate-700 rounded-2xl font-black active:scale-95 transition-all">× 違った</button>
                    <button onclick="check('correct')" class="flex-1 p-5 bg-emerald-500 text-white rounded-2xl font-black shadow-lg active:scale-95 transition-all">○ 合ってた！</button>
                </div>
            `;
        }

        function check(ans) {
            const q = state.queue[state.index];
            const isCorrect = (q.type === 'essay') ? (ans === 'correct') : (ans.trim() === q.answer);
            
            const pop = document.createElement('div'); pop.className = 'feedback-pop';
            pop.innerHTML = isCorrect ? '<span class="text-red-500">○</span>' : '<span class="text-blue-500">×</span>';
            document.getElementById('feedback-layer').appendChild(pop);
            
            setTimeout(() => pop.remove(), 800);
            setTimeout(() => showExplanation(isCorrect, q), 500);
        }

        function showExplanation(isCorrect, q) {
            const overlay = document.createElement('div'); overlay.className = 'fixed inset-0 bg-black/60 z-[60] flex items-end';
            overlay.innerHTML = `
                <div class="w-full bg-white rounded-t-[40px] p-8 slide-up dark:bg-slate-900 border-t-4 ${isCorrect ? 'border-red-500' : 'border-blue-500'}">
                    <div class="max-w-md mx-auto">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-3xl font-black ${isCorrect ? 'text-red-500' : 'text-blue-500'}">${isCorrect ? '正解！' : '不正解...'}</h3>
                            <button id="nextBtn" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg">次へ進む</button>
                        </div>
                        <div class="p-5 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                            <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Explanation / 解説</p>
                            <p class="font-bold text-sm leading-relaxed">${q.explanation}</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            document.getElementById('nextBtn').onclick = () => { 
                overlay.remove(); 
                if (!isCorrect) { 
                    state.queue.push(q); 
                    state.mistakes.push(q); 
                } 
                state.index++; 
                render(); 
            };
        }

        function finish() {
            const correctCount = state.totalQuestions; // 間違えた問題も最終的に解き終える仕様のため
            setStats(correctCount);
            
            document.getElementById('view-container').innerHTML = `
                <div class="text-center py-10 fade-in">
                    <div class="mb-6 inline-flex w-24 h-24 bg-yellow-400 rounded-full items-center justify-center text-white text-5xl shadow-xl shadow-yellow-200">
                        <i class="fa-solid fa-crown"></i>
                    </div>
                    <h2 class="text-4xl font-black mb-2 italic">Finish!</h2>
                    <p class="text-slate-500 font-bold mb-10 uppercase tracking-tighter">全問解き終わりました！</p>
                    
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl mb-8 border border-slate-100">
                        <p class="text-xs font-black text-slate-400 mb-1">今回の獲得スコア</p>
                        <p class="text-2xl font-black text-blue-600">+ ${correctCount} points</p>
                    </div>

                    <button onclick="showHome()" class="w-full p-6 bg-slate-900 text-white rounded-[2rem] font-black shadow-2xl active:scale-95 transition-all dark:bg-blue-600">
                        学習を終了する
                    </button>
                </div>
            `;
        }

        // --- バッジ・プロフィール表示 ---
        function showBadges() {
            const stats = getStats();
            const badgeList = [
                { name: "初陣", threshold: 1, icon: "fa-seedling", color: "text-green-500" },
                { name: "熟練者", threshold: 50, icon: "fa-fire", color: "text-orange-500" },
                { name: "マスター", threshold: 200, icon: "fa-gem", color: "text-blue-500" }
            ];

            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-black mb-6 mt-4">獲得バッジ</h2>
                    <div class="grid grid-cols-2 gap-4">
                        ${badgeList.map(b => `
                            <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl text-center ${stats.totalCorrect >= b.threshold ? '' : 'opacity-30 grayscale'}">
                                <i class="fa-solid ${b.icon} text-4xl ${b.color} mb-3"></i>
                                <p class="font-black text-sm">${b.name}</p>
                                <p class="text-[10px] font-bold text-slate-400 mt-1">${b.threshold}問達成</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showProfile() {
            const stats = getStats();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-black mb-6 mt-4">学習実績</h2>
                    <div class="space-y-4">
                        <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl flex justify-between items-center">
                            <span class="font-bold text-slate-500">総解答数</span>
                            <span class="font-black text-2xl text-blue-600">${stats.totalCorrect}問</span>
                        </div>
                        <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl flex justify-between items-center">
                            <span class="font-bold text-slate-500">学習回数</span>
                            <span class="font-black text-2xl text-emerald-500">${stats.totalSessions}回</span>
                        </div>
                        <button onclick="if(confirm('記録をすべて消去しますか？')){document.cookie='study_stats=;max-age=0;path=/';showHome();}" class="w-full p-4 text-xs font-bold text-red-400 bg-red-50 dark:bg-slate-800 rounded-xl mt-10">
                            データをリセットする
                        </button>
                    </div>
                </div>
            `;
        }

        // --- テーマ管理 ---
        document.getElementById('themeToggle').onclick = () => {
            state.isDark = !state.isDark;
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeToggle').innerHTML = state.isDark ? '<i class="fa-solid fa-sun text-yellow-400"></i>' : '<i class="fa-solid fa-moon"></i>';
        };

        showHome();
    </script>
</body>
</html>
