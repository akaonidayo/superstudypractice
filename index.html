<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StudyCanvas Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        :root { --header-h: 64px; --nav-h: calc(80px + env(safe-area-inset-bottom)); }
        body { font-family: 'Noto Sans JP', sans-serif; user-select: none; margin: 0; background-color: #f1f5f9; overflow-x: hidden; transition: background-color 0.3s; }
        .app-bg { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
        
        .app-bg { background-color: #f1f5f9; color: #0f172a; }
        .card-ui { background: white; border: 1px solid #e2e8f0; }

        .dark .app-bg { background-color: #020617; color: #f8fafc; }
        .dark .card-ui { background: #1e293b; border: 1px solid #334155; }
        .dark input, .dark textarea { background: #0f172a; color: white; border-color: #334155; }
        .dark header, .dark nav { background-color: rgba(2, 6, 23, 0.8) !important; border-color: #1e293b; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); width: 100%; max-width: 340px; }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; row-gap: 32px; }
        .badge-btn { display: flex; flex-direction: column; align-items: center; width: 100%; transition: 0.2s; }
        .badge-btn:last-child:nth-child(3n+1) { grid-column-start: 2; }
        .badge-text { font-size: 10px; font-weight: 900; line-height: 1.2; height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; margin-top: 8px; width: 100%; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0, 0.55, 0.45, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .feedback-pop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 8rem; font-weight: 900; z-index: 150; pointer-events: none; animation: popScale 0.8s ease-out forwards; }
        @keyframes popScale { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 0; } }

        .nav-btn { color: #94a3b8; transition: color 0.3s; }
        .nav-btn.active { color: #2563eb; }
        .dark .nav-btn.active { color: #60a5fa; }
        nav { padding-bottom: env(safe-area-inset-bottom); height: var(--nav-h); }
    </style>
</head>
<body>
    <div id="app" class="app-bg">
        <header class="h-16 border-b backdrop-blur sticky top-0 z-[200] flex items-center justify-between px-6 bg-white/80 transition-colors">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showHome()">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-pen-nib"></i></div>
                <h1 class="font-black text-xl italic tracking-tighter" id="header-display-name">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center transition-all"><i class="fa-solid fa-moon"></i></button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-40 max-w-md mx-auto w-full"></main>
        <div id="feedback-layer"></div>
        
        <nav class="fixed bottom-0 left-0 right-0 backdrop-blur border-t flex items-center justify-around z-[200] bg-white/80 transition-colors">
            <button id="nav-home" onclick="showHome()" class="nav-btn flex flex-col items-center font-black px-4 py-2"><i class="fa-solid fa-house-chimney text-xl"></i><span class="text-[10px] mt-1">ホーム</span></button>
            <button id="nav-badges" onclick="showBadges()" class="nav-btn flex flex-col items-center font-black px-4 py-2"><i class="fa-solid fa-award text-xl"></i><span class="text-[10px] mt-1">バッジ</span></button>
            <button id="nav-profile" onclick="showProfile()" class="nav-btn flex flex-col items-center font-black px-4 py-2"><i class="fa-solid fa-user-gear text-xl"></i><span class="text-[10px] mt-1">プロフ</span></button>
        </nav>
    </div>

    <div id="modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content card-ui p-8 text-center shadow-2xl rounded-[2.5rem]" onclick="event.stopPropagation()">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h3 id="modal-title" class="text-2xl font-black mb-1 dark:text-white"></h3>
            <p id="modal-status" class="text-[10px] font-black tracking-widest mb-6"></p>
            <p id="modal-desc" class="text-slate-500 dark:text-slate-200 font-bold mb-8 leading-relaxed whitespace-pre-wrap text-sm"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-blue-600 text-white rounded-full font-black shadow-lg active:scale-95 transition-transform">OK</button>
        </div>
    </div>

    <div id="name-modal" class="modal-overlay" onclick="closeNameModal()">
        <div class="modal-content card-ui p-8 text-center shadow-2xl rounded-[2.5rem]" onclick="event.stopPropagation()">
            <h3 class="text-xl font-black mb-6 dark:text-white">ニックネームを変更</h3>
            <input type="text" id="edit-nn" class="w-full p-4 border-2 rounded-2xl mb-8 font-black text-center text-lg outline-none focus:border-blue-500 transition-colors dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="新しい名前">
            <div class="flex gap-3">
                <button onclick="closeNameModal()" class="flex-1 py-4 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 rounded-2xl font-black active:scale-95">キャンセル</button>
                <button onclick="saveName()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg active:scale-95">保存する</button>
            </div>
        </div>
    </div>

    <script>
        const subjects = [
            { id: 'kokugo', name: '国語', color: 'bg-red-500', icon: 'fa-book-open', desc: '読解力と言語感覚を磨く', units: { 1: ["漢字の成り立ち", "文の組み立て"], 2: ["敬語", "短歌・俳句"], 3: ["和歌の心", "論説文"] } },
            { id: 'math', name: '数学', color: 'bg-blue-500', icon: 'fa-calculator', desc: '論理的思考と計算力を鍛える', units: { 1: ["正負の数", "方程式"], 2: ["連立方程式", "一次関数"], 3: ["因数分解", "二次方程式"] } },
            { id: 'english', name: '英語', color: 'bg-purple-500', icon: 'fa-language', desc: '世界とつながる言葉を学ぶ', units: { 1: ["be動詞", "一般動詞"], 2: ["未来形", "不定詞"], 3: ["現在完了", "関係代名詞"] } },
            { id: 'science', name: '理科', color: 'bg-emerald-500', icon: 'fa-flask', desc: '自然の仕組みを解き明かす', units: { 1: ["植物", "物質"], 2: ["化学変化", "細胞"], 3: ["イオン", "天体"] } },
            { id: 'social', name: '社会', color: 'bg-amber-500', icon: 'fa-earth-asia', desc: '歴史と社会の繋がりを知る', units: { 1: ["世界の姿", "古代日本"], 2: ["日本の地域", "中世"], 3: ["現代社会", "民主政治"] } }
        ];

        let state = { subj: '', grade: 1, unit: '', type: '', queue: [], index: 0, totalQuestions: 0, badgesCache: null };
        const STORAGE_KEY = "canv_master_v1_local";

        function getStats() { 
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { name: "ゲスト", total: 0, sessions: 0, typedChars: 0, math:0, english:0, science:0, social:0, kokugo:0 }; 
        }

        function saveStats(s) { 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
            if(document.getElementById('header-display-name')) document.getElementById('header-display-name').innerText = s.name;
        }

        function updateActiveNav(id) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${id}`).classList.add('active');
        }
        function closeAllPopups() { closeModal(); closeNameModal(); const ex = document.getElementById('explanation-overlay'); if (ex) ex.remove(); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function openNameModal() { 
            document.getElementById('edit-nn').value = getStats().name;
            document.getElementById('name-modal').classList.add('active'); 
        }
        function closeNameModal() { document.getElementById('name-modal').classList.remove('active'); }

        function showHome() {
            updateActiveNav('home'); const s = getStats(); closeAllPopups();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <div class="flex items-baseline gap-2 mt-6 mb-8">
                        <span class="text-3xl font-black dark:text-white">${s.name}</span>
                        <span class="text-slate-400 font-bold text-sm">さん</span>
                    </div>
                    <h2 class="text-xl font-black mb-4 dark:text-slate-400">学習を始める</h2>
                    <div class="grid gap-4">
                        ${subjects.map(sj => `
                            <button onclick="showGrade('${sj.id}')" class="card-ui p-5 flex items-center gap-4 rounded-[2rem] shadow-sm active:scale-95 transition-all">
                                <div class="${sj.color} w-14 h-14 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg"><i class="fa-solid ${sj.icon}"></i></div>
                                <div class="text-left">
                                    <span class="block font-black text-lg dark:text-white">${sj.name}</span>
                                    <span class="text-[10px] font-bold text-slate-400">${sj.desc}</span>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
        }

        async function showBadges() { 
            updateActiveNav('badges'); const s = getStats(); closeAllPopups();
            const container = document.getElementById('view-container');
            container.innerHTML = `<div class="flex flex-col items-center justify-center min-h-[40vh]"><i class="fa-solid fa-circle-notch animate-spin text-4xl text-blue-500 mb-4"></i><p class="font-bold text-slate-400">データを読み込み中...</p></div>`;
            
            try {
                if(!state.badgesCache) {
                    const res = await fetch('badges.json');
                    if(!res.ok) throw new Error();
                    state.badgesCache = await res.json();
                }
                const badges = state.badgesCache;

                container.innerHTML = `<div class="fade-in">
                    <h2 class="text-3xl font-black mt-6 mb-10 px-1 dark:text-white">コレクション</h2>
                    <div class="badge-grid">${badges.map((b) => { 
                        // 条件判定
                        let val = 0, required = b.c.v;
                        if(b.c.t === 'total') val = s.total || 0;
                        else if(b.c.t === 'sessions') val = s.sessions || 0;
                        else if(b.c.t === 'typed') val = s.typedChars || 0;
                        else if(b.c.t === 'subject') val = s[b.c.s] || 0;
                        
                        const isUnlocked = val >= required; 
                        const isHiding = b.sec === true && !isUnlocked; 
                        const iconClass = isUnlocked ? b.col : 'text-slate-200 dark:text-slate-700';
                        const iconHtml = `<div class="card-ui w-20 h-20 flex items-center justify-center rounded-[2.2rem] border-2 shadow-inner"><i class="fa-solid ${isHiding ? 'fa-lock' : b.i} ${iconClass} text-3xl"></i></div>`;
                        const displayName = isHiding ? '？？？？' : b.n;
                        
                        let desc = isUnlocked ? `獲得済み！\n${b.desc}` : (!isHiding ? `あと ${required - val} ${b.c.t === 'sessions' ? 'ページ' : (b.c.t === 'typed' ? '文字' : '問')} で獲得できます。` : `このバッジの取得条件は秘密です。`);
                        return `<button onclick="openModal('${displayName}', '${iconHtml.replace(/"/g, '&quot;')}', '${isUnlocked ? '獲得済み' : '未獲得'}', '${desc.replace(/\n/g, '\\n')}')" class="badge-btn active:scale-90">${iconHtml}<span class="badge-text font-black dark:text-slate-400 ${isHiding ? 'text-slate-400' : ''}">${displayName}</span></button>`;
                    }).join('')}</div>
                </div>`; 
            } catch(e) {
                container.innerHTML = `<div class="text-center py-20"><p class="font-black text-red-500 mb-2">バッジデータが見つかりません</p><p class="text-xs text-slate-400">サーバー環境で実行してください</p></div>`;
            }
        }

        function showProfile() {
            updateActiveNav('profile'); const s = getStats(); closeAllPopups();
            document.getElementById('view-container').innerHTML = `<div class="fade-in">
                <h2 class="text-3xl font-black mt-6 mb-8 dark:text-white">プロフィール</h2>
                <div class="card-ui p-6 rounded-[2.5rem] mb-6 flex justify-between items-center bg-slate-50 dark:bg-slate-800">
                    <div>
                        <span class="text-[10px] font-black text-slate-400 uppercase block mb-1">ニックネーム</span>
                        <span class="font-black text-xl dark:text-white" id="profile-name-display">${s.name}</span>
                    </div>
                    <button onclick="openNameModal()" class="bg-blue-100 text-blue-600 dark:bg-blue-900 dark:text-blue-300 px-5 py-3 rounded-xl font-black text-sm active:scale-95 transition-transform"><i class="fa-solid fa-pen mr-2"></i>編集</button>
                </div>
                <div class="card-ui p-8 rounded-[2.5rem] shadow-sm">
                    <h3 class="text-slate-400 text-[10px] font-black uppercase mb-6">学習レポート</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                            <span class="text-[10px] font-black text-slate-400 block mb-1">累計正解数</span>
                            <span class="text-3xl text-blue-600 font-black">${s.total} <span class="text-sm text-slate-500">問</span></span>
                        </div>
                        <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                            <span class="text-[10px] font-black text-slate-400 block mb-1">クリア数</span>
                            <span class="text-3xl text-emerald-500 font-black">${s.sessions || 0} <span class="text-sm text-slate-500">回</span></span>
                        </div>
                        <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl col-span-2">
                            <span class="text-[10px] font-black text-slate-400 block mb-1">タイピング数 (入力問題)</span>
                            <span class="text-3xl text-amber-500 font-black">${s.typedChars || 0} <span class="text-sm text-slate-500">文字</span></span>
                        </div>
                    </div>

                    <div class="space-y-6">${subjects.map(sj => {
                        const count = s[sj.id] || 0;
                        const percent = Math.min(100, (count / 20) * 100);
                        return `<div><div class="flex justify-between items-center mb-2 px-1"><span class="font-black text-sm dark:text-white">${sj.name}</span><span class="text-xs font-bold text-slate-400">${count} 問</span></div><div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div class="${sj.color} h-full transition-all duration-1000" style="width: ${percent}%\"></div></div></div>`;
                    }).join('')}</div>
                </div>
            </div>`;
        }

        function saveName() {
            const val = document.getElementById('edit-nn').value.trim();
            if(!val) return;
            const s = getStats(); s.name = val;
            saveStats(s); 
            closeNameModal();
            if(document.getElementById('profile-name-display')) document.getElementById('profile-name-display').innerText = s.name;
        }

        function openModal(title, iconHtml, status, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-icon').innerHTML = iconHtml;
            document.getElementById('modal-status').innerText = status;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.add('active');
        }

        function showGrade(subjId) {
            state.subj = subjId;
            document.getElementById('view-container').innerHTML = `<div class="fade-in"><button onclick="showHome()" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button><h2 class="text-2xl font-black mb-6 dark:text-white">学年を選択</h2><div class="grid gap-3">${[1, 2, 3].map(g => `<button onclick="showUnit('${subjId}', ${g})" class="card-ui p-6 rounded-[1.5rem] font-black text-xl flex justify-between items-center active:bg-blue-50 dark:text-white">第${g}学年<i class="fa-solid fa-chevron-right text-blue-500"></i></button>`).join('')}</div></div>`;
        }

        function showUnit(subjId, grade) {
            state.grade = grade;
            const units = subjects.find(s => s.id === subjId).units[grade] || [];
            document.getElementById('view-container').innerHTML = `<div class="fade-in"><button onclick="showGrade('${subjId}')" class="mb-4 text-slate-500 font-bold flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> 戻る</button><h2 class="text-2xl font-black mb-6 dark:text-white">単元を選択</h2><div class="grid gap-3">${units.map(u => `<button onclick="state.unit='${u}'; showLevel()" class="card-ui p-5 rounded-2xl font-bold text-left border-l-4 border-blue-500 dark:text-white">${u}</button>`).join('')}</div></div>`;
        }

        function showLevel() {
            document.getElementById('view-container').innerHTML = `<div class="fade-in text-center"><button onclick="showUnit('${state.subj}', ${state.grade})" class="mb-4 text-slate-500 font-bold flex items-center gap-2 text-left"><i class="fa-solid fa-chevron-left"></i> 戻る</button><h2 class="text-2xl font-black mb-8 mt-4 dark:text-white">レベルを選択</h2><div class="grid gap-5"><button onclick="fetchQuestions('basic')" class="p-8 rounded-[2.5rem] bg-blue-600 text-white shadow-xl font-black text-xl active:scale-95 transition-transform">基本・選択</button><button onclick="fetchQuestions('input')" class="p-8 rounded-[2.5rem] bg-emerald-500 text-white shadow-xl font-black text-xl active:scale-95 transition-transform">確かめ・入力</button><button onclick="fetchQuestions('essay')" class="p-8 rounded-[2.5rem] bg-amber-500 text-white shadow-xl font-black text-xl active:scale-95 transition-transform">応用・記述</button></div></div>`;
        }

        async function fetchQuestions(type) {
            state.type = type;
            const container = document.getElementById('view-container');
            container.innerHTML = `<div class="flex items-center justify-center min-h-[50vh]"><i class="fa-solid fa-circle-notch animate-spin text-4xl text-blue-500"></i></div>`;
            try {
                const response = await fetch(`questions/${state.subj}${state.grade}${type}.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                state.queue = data.filter(q => q.unit === state.unit).sort(() => Math.random() - 0.5);
                if (state.queue.length === 0) throw new Error();
                state.index = 0; state.totalQuestions = state.queue.length; render();
            } catch (e) {
                container.innerHTML = `<div class="text-center py-20"><p class="font-black text-red-500 mb-2">問題データが見つかりません</p><button onclick="showLevel()" class="mt-8 px-8 py-3 bg-slate-200 dark:bg-slate-800 rounded-full font-black text-sm">戻る</button></div>`;
            }
        }

        function render() {
            if (state.index >= state.queue.length) { finish(); return; }
            const q = state.queue[state.index];
            const progress = (state.index / state.totalQuestions) * 100;
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="px-3 py-1 bg-slate-900 text-white rounded-full text-[10px] font-black uppercase">${q.unit}</span>
                        <div class="text-right"><span class="text-lg font-black text-blue-600">${state.index + 1}</span><span class="text-xs font-bold text-slate-400"> / ${state.totalQuestions}</span></div>
                    </div>
                    <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full mb-6 overflow-hidden">
                        <div class="h-full bg-blue-500 transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                    <div class="card-ui p-10 rounded-[2.5rem] shadow-sm text-center mb-8 min-h-[160px] flex items-center justify-center">
                        <p class="text-xl font-black leading-relaxed dark:text-white">${q.question}</p>
                    </div>
                    <div id="answer-zone" class="space-y-3">${renderUI(q)}</div>
                </div>`;
        }

        function renderUI(q) {
            if (state.type === 'basic') return q.options.map(o => `<button onclick="check('${o}')" class="card-ui w-full p-5 rounded-2xl font-bold text-left active:scale-95 hover:border-blue-500 dark:text-white">${o}</button>`).join('');
            if (state.type === 'input') return `<input type="text" id="userInput" class="w-full p-5 border-2 rounded-2xl mb-4 text-center font-bold text-2xl dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="答えを入力"><button onclick="check(document.getElementById('userInput').value)" class="w-full p-5 bg-blue-600 text-white rounded-2xl font-black shadow-lg">回答を送信</button>`;
            return `<textarea id="userText" class="w-full p-5 border-2 rounded-2xl mb-4 h-40 font-medium dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="考え方のメモ..."></textarea><button onclick="check('essay_confirm')" class="w-full p-5 bg-amber-500 text-white rounded-2xl font-black shadow-lg">正解を確認</button>`;
        }

        function check(ans) {
            const q = state.queue[state.index];
            const isCorrect = (state.type === 'essay') ? true : (ans.trim() === q.answer);
            
            // 入力文字数をカウント(合否に関わらずタイピング量として)
            if(state.type === 'input' && ans.trim().length > 0) {
                const s = getStats();
                s.typedChars = (s.typedChars || 0) + ans.trim().length;
                saveStats(s);
            }

            const pop = document.createElement('div'); pop.className = 'feedback-pop';
            pop.innerHTML = isCorrect ? '<span class="text-red-500">○</span>' : '<span class="text-blue-500">×</span>';
            document.getElementById('feedback-layer').appendChild(pop);
            setTimeout(() => pop.remove(), 800);
            setTimeout(() => showExplanation(isCorrect, q), 500);
        }

        function showExplanation(isCorrect, q) {
            const overlay = document.createElement('div'); 
            overlay.id = 'explanation-overlay';
            overlay.className = 'fixed top-16 bottom-[80px] left-0 right-0 bg-black/60 z-[100] flex items-end pb-[env(safe-area-inset-bottom)]';
            overlay.innerHTML = `
                <div class="w-full bg-white dark:bg-slate-900 rounded-t-[40px] p-8 slide-up border-t-4 ${isCorrect ? 'border-red-500' : 'border-blue-500'}">
                    <div class="max-w-md mx-auto pb-4">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-3xl font-black ${isCorrect ? 'text-red-500' : 'text-blue-500'}">${isCorrect ? '正解！' : '不正解...'}</h3>
                            <button id="nextBtn" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg">次へ</button>
                        </div>
                        <div class="p-5 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                            <p class="font-bold text-sm leading-relaxed dark:text-slate-200">${q.explanation}</p>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            document.getElementById('nextBtn').onclick = () => { 
                overlay.remove(); 
                if (isCorrect) { 
                    const s = getStats(); 
                    s.total++; 
                    s[state.subj] = (s[state.subj] || 0) + 1; 
                    saveStats(s); 
                } else { 
                    state.queue.push(q); 
                }
                state.index++; render(); 
            };
        }

        function finish() {
            // セッション(クリア回数)を追加
            const s = getStats();
            s.sessions = (s.sessions || 0) + 1;
            saveStats(s);

            document.getElementById('view-container').innerHTML = `
                <div class="fade-in text-center py-10">
                    <div class="w-24 h-24 bg-yellow-400 rounded-full flex items-center justify-center text-white text-5xl mx-auto mb-6 shadow-xl animate-bounce"><i class="fa-solid fa-crown"></i></div>
                    <h2 class="text-3xl font-black mb-2 dark:text-white">COMPLETE!</h2>
                    <p class="text-slate-500 font-bold mb-10">全ての課題をクリア！</p>
                    <button onclick="showHome()" class="w-full py-5 bg-blue-600 text-white rounded-full font-black shadow-lg">ホームに戻る</button>
                </div>`;
        }

        const themeBtn = document.getElementById('themeToggle');
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeBtn.innerHTML = '<i class="fa-solid fa-sun text-yellow-400"></i>';
            } else {
                document.documentElement.classList.remove('dark');
                themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
            localStorage.setItem('canv_theme', theme);
        }

        themeBtn.onclick = () => applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(localStorage.getItem('canv_theme') || 'light');
            showHome();
        });
    </script>
</body>
</html>
