<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyCanvas Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; transition: 0.3s; user-select: none; }
        .dark { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-white { background-color: #1e293b; color: #f8fafc; }
        .dark .bg-slate-50 { background-color: #0f172a; }
        @keyframes popFade { 0% { transform: translate(-50%, -40%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1); opacity: 0; } }
        .feedback-pop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 150px; z-index: 1000; pointer-events: none; animation: popFade 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

    <div id="app" class="flex flex-col min-h-screen">
        <header class="h-16 border-b bg-white/80 backdrop-blur sticky top-0 z-50 flex items-center justify-between px-6 dark:bg-slate-900/80 dark:border-slate-800">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="font-black text-xl italic tracking-tighter">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center transition-transform active:scale-90">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-28 max-w-md mx-auto w-full"></main>
        <div id="feedback-layer"></div>

        <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white/90 backdrop-blur border-t flex items-center justify-around z-40 dark:bg-slate-900/90 dark:border-slate-800">
            <button onclick="showHome()" class="flex flex-col items-center gap-1 text-blue-600"><i class="fa-solid fa-house-chimney text-xl"></i><span class="text-[10px] font-black uppercase">Home</span></button>
        </nav>
    </div>

    <script>
        const subjects = [
            { id: 'kokugo', name: '国語', color: 'bg-red-500', units: { 1: ["漢字", "文法", "古文"], 2: ["短歌", "随筆"], 3: ["論説", "和歌"] } },
            { id: 'math', name: '数学', color: 'bg-blue-500', units: { 1: ["正負の数", "文字式", "方程式"], 2: ["式の計算", "連立方程式", "一次関数"], 3: ["展開・因数分解", "平方根", "二次方程式"] } },
            { id: 'science', name: '理科', color: 'bg-emerald-500', units: { 1: ["植物", "光・音"], 2: ["化学変化", "電気"], 3: ["運動", "天体"] } },
            { id: 'social', name: '社会', color: 'bg-amber-500', units: { 1: ["地理", "歴史初期"], 2: ["歴史中期", "近現代"], 3: ["公民"] } },
            { id: 'english', name: '英語', color: 'bg-purple-500', units: { 1: ["Be動詞", "一般動詞"], 2: ["不定詞", "比較"], 3: ["現在完了", "関係代名詞"] } }
        ];

        let state = { subj: '', grade: '', unit: '', queue: [], index: 0, mistakes: [], isDark: false };

        function showHome() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-black mb-6 mt-4">教科を選択</h2>
                    <div class="grid gap-4">
                        ${subjects.map(s => `
                            <button onclick="showGrade('${s.id}')" class="p-5 bg-white rounded-3xl border border-slate-100 flex items-center gap-4 active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700">
                                <div class="${s.color} w-12 h-12 rounded-2xl flex items-center justify-center text-white text-xl"><i class="fa-solid fa-book"></i></div>
                                <span class="font-bold text-lg">${s.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showGrade(subjId) {
            state.subj = subjId;
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showHome()" class="mb-4 text-slate-400 font-bold"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-6">学年を選択</h2>
                    <div class="grid gap-3">
                        ${[1, 2, 3].map(g => `<button onclick="showUnit('${subjId}', ${g})" class="p-6 bg-white border rounded-3xl font-black text-xl active:bg-slate-50 dark:bg-slate-800 dark:border-slate-700">中${g}</button>`).join('')}
                    </div>
                </div>
            `;
        }

        function showUnit(subjId, grade) {
            state.grade = grade;
            const subj = subjects.find(s => s.id === subjId);
            const units = subj.units[grade] || [];
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <button onclick="showGrade('${subjId}')" class="mb-4 text-slate-400 font-bold"><i class="fa-solid fa-chevron-left"></i> 戻る</button>
                    <h2 class="text-2xl font-black mb-6 italic">単元を選択</h2>
                    <div class="grid gap-3">
                        ${units.map(u => `<button onclick="state.unit='${u}'; showLevel()" class="p-5 bg-white border border-blue-100 rounded-2xl font-bold text-left hover:border-blue-500 dark:bg-slate-800 dark:border-slate-700">${u}</button>`).join('')}
                    </div>
                </div>
            `;
        }

        function showLevel() {
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-2xl font-black mb-10 text-center mt-6">レベルを選択</h2>
                    <div class="grid gap-5">
                        <button onclick="fetchQuestions('basic')" class="p-8 rounded-[40px] bg-blue-600 text-white shadow-xl shadow-blue-500/20 font-black text-xl italic">基本 / SELECTIVE</button>
                        <button onclick="fetchQuestions('input')" class="p-8 rounded-[40px] bg-emerald-500 text-white shadow-xl shadow-emerald-500/20 font-black text-xl italic">確かめ / INPUT</button>
                        <button onclick="fetchQuestions('essay')" class="p-8 rounded-[40px] bg-amber-500 text-white shadow-xl shadow-amber-500/20 font-black text-xl italic">応用 / WRITING</button>
                    </div>
                </div>
            `;
        }

        async function fetchQuestions(type) {
            const fileName = `${state.subj}${state.grade}${type}.json`;
            try {
                const response = await fetch(`./questions/${fileName}`);
                if (!response.ok) throw new Error();
                const all = await response.json();
                // 選択した単元でフィルタリング
                state.queue = all.filter(q => q.unit === state.unit);
                state.index = 0;
                state.mistakes = [];
                if (state.queue.length === 0) { alert(`${state.unit}の問題がまだありません。`); return; }
                render();
            } catch (e) { alert("問題ファイルが見つかりません。"); }
        }

        function render() {
            if (state.index >= state.queue.length) { finish(); return; }
            const q = state.queue[state.index];
            const container = document.getElementById('view-container');
            container.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <span class="px-3 py-1 bg-slate-900 text-white rounded-full text-[10px] font-black tracking-widest uppercase">${q.unit}</span>
                        <button onclick="finish(true)" class="text-xs font-bold text-red-400">終了</button>
                    </div>
                    <div class="relative p-10 bg-white rounded-[40px] shadow-sm border dark:bg-slate-800 dark:border-slate-700 text-center mb-8">
                        <p class="text-xl font-black leading-relaxed">${q.question}</p>
                    </div>
                    <div id="answer-zone" class="space-y-3">${renderUI(q)}</div>
                </div>
            `;
        }

        function renderUI(q) {
            if (q.type === 'basic') return q.options.map(o => `<button onclick="check('${o}')" class="w-full p-5 bg-white border-2 border-slate-100 rounded-2xl font-bold text-left active:scale-95 transition-all dark:bg-slate-800 dark:border-slate-700">${o}</button>`).join('');
            if (q.type === 'input') return `<input type="text" id="userInput" class="w-full p-5 border-2 rounded-2xl mb-4 text-center font-bold text-2xl dark:text-slate-900" placeholder="答えを入力"><button onclick="check(document.getElementById('userInput').value)" class="w-full p-5 bg-blue-600 text-white rounded-2xl font-black">回答</button>`;
            return `<textarea id="userText" class="w-full p-5 border-2 rounded-2xl mb-4 h-40 font-medium dark:text-slate-900" placeholder="考えを記述..."></textarea><button onclick="showEssayAnswer()" class="w-full p-5 bg-amber-500 text-white rounded-2xl font-black">正解を確認</button>`;
        }

        function showEssayAnswer() {
            const q = state.queue[state.index];
            document.getElementById('answer-zone').innerHTML = `<div class="p-6 bg-slate-100 rounded-3xl mb-5 text-sm font-bold dark:text-slate-800">${q.answer}</div><div class="flex gap-4"><button onclick="check('wrong')" class="flex-1 p-5 bg-slate-200 rounded-2xl font-black dark:text-slate-800">× 違う</button><button onclick="check('correct')" class="flex-1 p-5 bg-emerald-500 text-white rounded-2xl font-black">○ 正解</button></div>`;
        }

        function check(ans) {
            const q = state.queue[state.index];
            const isCorrect = (q.type === 'essay') ? (ans === 'correct') : (ans.trim() === q.answer);
            const pop = document.createElement('div'); pop.className = 'feedback-pop';
            pop.innerHTML = isCorrect ? '<span class="text-red-500">○</span>' : '<span class="text-blue-500">×</span>';
            document.getElementById('feedback-layer').appendChild(pop);
            setTimeout(() => pop.remove(), 800);
            setTimeout(() => showExplanation(isCorrect, q), 500);
        }

        function showExplanation(isCorrect, q) {
            const overlay = document.createElement('div'); overlay.className = 'fixed inset-0 bg-black/60 z-[60] flex items-end';
            overlay.innerHTML = `<div class="w-full bg-white rounded-t-[40px] p-8 slide-up dark:bg-slate-900"><div class="max-w-md mx-auto"><div class="flex justify-between items-center mb-6"><h3 class="text-3xl font-black ${isCorrect ? 'text-red-500' : 'text-blue-500'}">${isCorrect ? '正解！' : '不正解'}</h3><button id="nextBtn" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black">次へ</button></div><div class="p-5 bg-slate-50 rounded-2xl dark:bg-slate-800"><p class="text-[10px] font-black text-slate-400 mb-2 uppercase">Reason</p><p class="font-bold text-sm">${q.explanation}</p></div></div></div>`;
            document.body.appendChild(overlay);
            document.getElementById('nextBtn').onclick = () => { overlay.remove(); if (!isCorrect) { state.queue.push(q); state.mistakes.push(q); } state.index++; render(); };
        }

        function finish() { document.getElementById('view-container').innerHTML = `<div class="text-center py-10 fade-in"><h2 class="text-4xl font-black mb-8 italic uppercase">Finish!</h2><button onclick="showHome()" class="w-full p-6 bg-slate-900 text-white rounded-[28px] font-black dark:bg-blue-600">ホームへ</button></div>`; }
        document.getElementById('themeToggle').onclick = () => { state.isDark = !state.isDark; document.documentElement.classList.toggle('dark'); };
        showHome();
    </script>
</body>
</html>
