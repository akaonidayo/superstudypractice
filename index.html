<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyCanvas Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; transition: 0.3s; user-select: none; margin: 0; }
        .app-bg { min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        
        body:not(.dark) .app-bg { background-color: #f1f5f9; color: #0f172a; }
        body:not(.dark) .card-ui { background: white; border: 1px solid #e2e8f0; }
        .dark .app-bg { background-color: #020617; color: #f8fafc; }
        .dark .card-ui { background: #1e293b; border: 1px solid #334155; }
        .dark input { background: #0f172a; color: white; border-color: #334155; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); width: 100%; max-width: 340px; }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; row-gap: 32px; }
        .badge-btn { display: flex; flex-direction: column; align-items: center; width: 100%; transition: 0.2s; }
        .badge-text { 
            font-size: 10px; font-weight: 900; line-height: 1.2; height: 2.4em; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-align: center; margin-top: 8px; width: 100%;
        }
        progress::-webkit-progress-bar { background-color: #e2e8f0; border-radius: 10px; }
        .dark progress::-webkit-progress-bar { background-color: #334155; }
    </style>
</head>
<body>
    <div id="app" class="app-bg">
        <header class="h-16 border-b backdrop-blur sticky top-0 z-50 flex items-center justify-between px-6 dark:border-slate-800">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showHome()">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-pen-nib"></i></div>
                <h1 class="font-black text-xl italic tracking-tighter" id="header-display-name">StudyCanvas</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center transition-all"><i class="fa-solid fa-moon"></i></button>
        </header>

        <main id="view-container" class="flex-1 p-5 pb-32 max-w-md mx-auto w-full"></main>
        
        <nav class="fixed bottom-0 left-0 right-0 h-20 backdrop-blur border-t flex items-center justify-around z-40 dark:border-slate-800">
            <button onclick="showHome()" class="flex flex-col items-center text-slate-400 font-black active:text-blue-600 transition-colors"><i class="fa-solid fa-house-chimney text-xl"></i><span class="text-[10px] mt-1">HOME</span></button>
            <button onclick="showBadges()" class="flex flex-col items-center text-slate-400 font-black active:text-blue-600 transition-colors"><i class="fa-solid fa-award text-xl"></i><span class="text-[10px] mt-1">BADGES</span></button>
            <button onclick="showProfile()" class="flex flex-col items-center text-slate-400 font-black active:text-blue-600 transition-colors"><i class="fa-solid fa-user-gear text-xl"></i><span class="text-[10px] mt-1">PROFILE</span></button>
        </nav>
    </div>

    <div id="modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content card-ui p-8 text-center shadow-2xl rounded-[2.5rem]" onclick="event.stopPropagation()">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h3 id="modal-title" class="text-2xl font-black mb-1"></h3>
            <p id="modal-status" class="text-[10px] font-black tracking-widest mb-6"></p>
            <p id="modal-desc" class="text-slate-500 dark:text-slate-400 font-bold mb-8 leading-relaxed whitespace-pre-wrap text-sm"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-blue-600 text-white rounded-full font-black shadow-lg active:scale-95 transition-transform">OK</button>
        </div>
    </div>

    <script>
        // バッジデータ等の定数はそのまま維持
        const badgeNames = ["最初の一歩", "学びの芽生え", "ノートの旅人", "ペン先の魔術師", "放課後の覇者", "知識の狩人", "朝活の達人", "記憶の保管者", "図書室の主", "インクの騎士", "閃きの開拓者", "論理の守護者", "集中力の権化", "努力の結晶", "学問の徒", "真理の門", "鉛筆の踊り子", "辞書の探検家", "知性の翼", "静寂の読書家", "数学の天才", "公式の使い手", "計算の荒獅子", "論理の要塞", "数の求道者", "英単語の王", "文法の支配者", "翻訳の達人", "語学の聖域", "対話の達人", "理科の観測者", "元素の支配者", "宇宙の目撃者", "実験の鬼", "自然の友", "歴史の証言者", "地図の覇者", "文明の伝承者", "社会の設計士", "時代の語り部"];
        const badges = [];
        for(let i=0; i<100; i++) {
            let icon = "fa-star", color = "text-yellow-500";
            if(i < 10) { icon = "fa-seedling"; color = "text-green-500"; }
            else if(i < 20) { icon = "fa-bolt"; color = "text-amber-500"; }
            else if(i < 30) { icon = "fa-shield-halved"; color = "text-blue-500"; }
            else if(i < 40) { icon = "fa-gem"; color = "text-cyan-500"; }
            else if(i < 50) { icon = "fa-fire"; color = "text-red-500"; }
            else if(i < 100) { icon = "fa-crown"; color = "text-yellow-600"; }
            badges.push({ n: badgeNames[i] || `栄光の称号 #${i+1}`, t: (i + 1) * 10, i: icon, c: color, s: i >= 30 ? 1 : 0 });
        }

        const subjects = [
            { id: 'math', name: '数学', color: 'bg-blue-500', icon: 'fa-calculator' },
            { id: 'english', name: '英語', color: 'bg-purple-500', icon: 'fa-language' },
            { id: 'science', name: '理科', color: 'bg-emerald-500', icon: 'fa-flask' },
            { id: 'social', name: '社会', color: 'bg-amber-500', icon: 'fa-earth-asia' },
            { id: 'kokugo', name: '国語', color: 'bg-red-500', icon: 'fa-book-open' }
        ];

        const COOKIE_KEY = "canv_master_v1";
        function getStats() { 
            const m = document.cookie.match(new RegExp(COOKIE_KEY + '=([^;]+)')); 
            return m ? JSON.parse(m[1]) : { name: "ゲスト", total: 0, math:0, english:0, science:0, social:0, kokugo:0 }; 
        }
        
        function saveStats(s) { 
            document.cookie = `${COOKIE_KEY}=${JSON.stringify(s)}; max-age=31536000; path=/`; 
            // 名前変更を反映
            updateUIWithNewName(s.name);
        }

        // 名前の表示をすべて更新する関数
        function updateUIWithNewName(name) {
            // ヘッダータイトルの更新
            const headerName = document.getElementById('header-display-name');
            if(headerName) headerName.innerText = name;
            
            // ホーム画面の名前の更新
            const homeName = document.getElementById('home-user-name');
            if(homeName) homeName.innerText = name;
        }

        function showHome() {
            const s = getStats();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <div class="flex items-baseline gap-2 mt-6 mb-8">
                        <span id="home-user-name" class="text-3xl font-black">${s.name}</span>
                        <span class="text-slate-400 font-bold text-sm">さん</span>
                    </div>
                    <div class="grid gap-4">
                        ${subjects.map(sj => `
                            <button onclick="showHome()" class="card-ui p-6 flex items-center justify-between rounded-[2rem] shadow-sm active:scale-95 transition-all">
                                <div class="flex items-center gap-5">
                                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-xl ${sj.color} shadow-lg"><i class="fa-solid ${sj.icon}"></i></div>
                                    <span class="font-black text-xl">${sj.name}</span>
                                </div>
                                <i class="fa-solid fa-chevron-right text-slate-300"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
            // 描画後にヘッダー等の名前も整合させる
            updateUIWithNewName(s.name);
        }

        function showProfile() {
            const s = getStats();
            document.getElementById('view-container').innerHTML = `
                <div class="fade-in">
                    <h2 class="text-3xl font-black mt-6 mb-8">プロフィール</h2>
                    <div class="card-ui p-6 rounded-[2.5rem] mb-6 shadow-sm">
                        <label class="text-[10px] font-black text-slate-400 uppercase mb-3 block px-1">ニックネーム</label>
                        <div class="flex flex-wrap gap-3">
                            <input type="text" id="nn" value="${s.name}" class="flex-1 min-w-[150px] p-4 rounded-full font-black outline-none border-2 transition-all focus:border-blue-500">
                            <button onclick="saveName()" class="bg-blue-600 text-white px-8 py-4 rounded-full font-black shadow-lg active:scale-95">保存</button>
                        </div>
                    </div>
                    
                    <div class="card-ui p-8 rounded-[2.5rem] shadow-sm">
                        <h3 class="text-slate-400 text-[10px] font-black uppercase mb-6 tracking-widest italic">学習レポート</h3>
                        <div class="flex justify-between items-end mb-10 border-b pb-4 dark:border-slate-800">
                            <span class="font-black text-slate-500 text-sm">累計正解数</span>
                            <span class="text-5xl text-blue-600 font-black">${s.total}</span>
                        </div>
                        <div class="space-y-6">
                            ${subjects.map(sj => {
                                const count = s[sj.id] || 0;
                                const percent = Math.min(100, (count / 200) * 100);
                                return `<div><div class="flex justify-between items-center mb-2 px-1"><span class="font-black text-sm">${sj.name}</span><span class="text-xs font-bold text-slate-400">${count} 問</span></div><div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div class="${sj.color} h-full transition-all duration-1000" style="width: ${percent}%"></div></div></div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function saveName() {
            const s = getStats();
            const newName = document.getElementById('nn').value.trim() || "ゲスト";
            s.name = newName;
            saveStats(s);
            openModal("保存完了", "<i class='fa-solid fa-check-circle text-emerald-500'></i>", "SUCCESS", "ニックネームを更新しました！");
        }

        // その他の共通関数
        function openModal(title, iconHtml, status, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-icon').innerHTML = iconHtml;
            document.getElementById('modal-status').innerText = status;
            document.getElementById('modal-status').className = `text-[10px] font-black tracking-widest mb-6 ${status === '獲得済み' ? 'text-emerald-500' : 'text-slate-400'}`;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function showBadges() { /* 同上のロジック */ const s = getStats(); document.getElementById('view-container').innerHTML = `<div class="fade-in"><h2 class="text-3xl font-black mt-6 mb-10 px-1">コレクション</h2><div class="badge-grid">${badges.map((b) => { const val = s.total || 0; const isUnlocked = val >= b.t; const isHiding = b.s === 1 && !isUnlocked; const iconClass = isUnlocked ? b.c : 'text-slate-200 dark:text-slate-700'; const borderClass = isUnlocked ? b.c.replace('text','border') : 'border-transparent'; const iconHtml = `<div class="card-ui w-20 h-20 flex items-center justify-center rounded-[2.2rem] border-2 ${borderClass} shadow-inner"><i class="fa-solid ${isHiding ? 'fa-lock' : b.i} ${iconClass} text-3xl"></i></div>`; const displayName = isHiding ? '？？？？' : b.n; const statusText = isUnlocked ? '獲得済み' : '未獲得'; let desc = isUnlocked ? `獲得済み！\n累計 ${b.t} 問正解を達成しました。` : (!isHiding ? `あと ${b.t - val} 問正解で獲得できます。\n(目標: ${b.t} / 現在: ${val})` : `このバッジの正体は秘密です。`); return `<button onclick="openModal('${displayName}', '${iconHtml.replace(/"/g, '&quot;')}', '${statusText}', '${desc.replace(/\n/g, '\\n')}')" class="badge-btn active:scale-90">${iconHtml}<span class="badge-text font-black ${isHiding ? 'text-slate-400' : ''}">${displayName}</span></button>`; }).join('')}</div></div>`; }
        document.getElementById('themeToggle').onclick = () => { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeToggle').innerHTML = isDark ? '<i class="fa-solid fa-sun text-yellow-400"></i>' : '<i class="fa-solid fa-moon"></i>'; };

        showHome();
    </script>
</body>
</html>
